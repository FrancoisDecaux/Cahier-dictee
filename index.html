<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dictée">
<meta name="theme-color" content="#FDFCF7">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="apple-touch-icon" href="icone.png">
<title>Cahier de dictée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Playwrite+FR+Trad:wght@400&display=swap">
<style>
  :root {
    color-scheme: light;
    --papier: #FDFCF7;
    --carreau: #E3EAF6;
    --carreau-fort: #CBD7EE;
    --reglure: #AFC2E6;
    --marge: #E4877E;
    --encre: #1D3480;
    --encre-douce: #51619A;
    --fluo: #FFB05C;
    --fluo-pale: #FFE3C2;
    --vert: #2A9158;
    --vert-pale: #DDF3E6;
    --rouge: #CF3F35;
    --rouge-pale: #FBE1DE;
    --surligneur-vert: #8EE0A8;
    --surligneur-rouge: #F7ADA5;
    --blanc: #FFFFFF;
    --c-grande: #FF9B3D;
    --c-petite: #3FB2BF;
    --ombre: 0 3px 0 rgba(29, 52, 128, .18);
    --f-texte: "Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    --f-titre: "Playwrite FR Trad", "Snell Roundhand", "Brush Script MT", cursive;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--f-texte);
    font-size: 18px;
    color: var(--encre);
    background-color: var(--papier);
    background-image:
      repeating-linear-gradient(to bottom, var(--carreau-fort) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(to bottom, var(--carreau) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(to right, var(--carreau-fort) 0 1px, transparent 1px 32px);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--fluo); outline-offset: 2px; }
  input, textarea { font: inherit; color: var(--encre); -webkit-user-select: text; user-select: text; }

  #app {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100%;
    padding-inline: 16px;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---------- éléments communs ---------- */
  .titre-cursif {
    font-family: var(--f-titre);
    font-weight: 400;
    font-size: clamp(34px, 6vw, 52px);
    line-height: 1.5;
    margin: 0;
    text-wrap: balance;
  }
  .sous-titre { margin: 0; color: var(--encre-douce); font-size: 20px; }
  .bouton {
    border: 2px solid var(--encre);
    background: var(--blanc);
    border-radius: 14px;
    padding: 12px 22px;
    font-weight: 700;
    font-size: 19px;
    box-shadow: var(--ombre);
    min-height: 52px;
  }
  .bouton:active { transform: translateY(2px); box-shadow: none; }
  .bouton.plein { background: var(--encre); color: var(--blanc); }
  .bouton.discret { border-color: transparent; background: transparent; box-shadow: none; color: var(--encre-douce); font-weight: 400; }
  .ligne-boutons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

  /* ---------- accueil ---------- */
  .accueil-tete { display: flex; flex-direction: column; gap: 4px; padding-top: 12px; }
  .profils { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .profil {
    position: relative;
    text-align: left;
    border: 2px solid var(--encre);
    border-radius: 20px;
    background: var(--blanc);
    padding: 22px 22px 22px 40px;
    box-shadow: 0 5px 0 var(--encre);
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
  }
  .profil::before {
    content: "";
    position: absolute;
    left: 20px; top: 0; bottom: 0;
    width: 2px;
    background: var(--marge);
  }
  .profil:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--encre); }
  .profil .classe {
    align-self: flex-start;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .08em;
    padding: 2px 10px;
    border-radius: 6px;
    background: var(--c);
    color: var(--encre);
  }
  .profil .prenom { font-size: 34px; font-weight: 700; line-height: 1.15; }
  .profil .liste { color: var(--encre-douce); font-size: 17px; }
  .pied { display: flex; justify-content: center; margin-top: auto; }

  /* ---------- menu des jeux ---------- */
  .menu-tete { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .menu-tete .qui { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
  .menu-tete .qui strong { font-size: 30px; line-height: 1.2; }
  .menu-tete .qui span { color: var(--encre-douce); }
  .jeux { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .carte-jeu {
    text-align: left;
    border: 2px solid var(--encre);
    border-radius: 18px;
    background: var(--blanc);
    padding: 16px 18px;
    box-shadow: var(--ombre);
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    gap: 6px;
    min-height: 190px;
  }
  .carte-jeu:active { transform: translateY(2px); box-shadow: none; }
  .carte-jeu .apercu {
    font-size: 24px;
    height: 48px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid var(--reglure);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
  }
  .carte-jeu h3 { margin: 0; font-size: 22px; }
  .carte-jeu p { margin: 0; color: var(--encre-douce); font-size: 16px; }
  .carte-jeu .record { font-size: 15px; font-weight: 700; color: var(--encre-douce); }
  .carte-jeu.vedette { background: var(--fluo-pale); }
  .ap-trou { display: inline-block; width: .6em; border-bottom: 3px solid var(--encre); height: 1em; }
  .ap-tuile { font-size: 17px; border: 2px solid var(--encre); border-radius: 8px; padding: 0 7px; background: var(--papier); }
  .ap-barre { text-decoration: line-through; text-decoration-color: var(--rouge); color: var(--encre-douce); }
  .ap-juste { background: linear-gradient(transparent 55%, var(--fluo) 55%); padding: 0 2px; }

  /* ---------- écran de jeu ---------- */
  .barre { display: flex; align-items: center; gap: 12px; }
  .barre .bouton { min-height: 44px; padding: 6px 14px; font-size: 16px; }
  .progression { flex: 1; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .point {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--encre);
    background: var(--blanc);
  }
  .point.ok { background: var(--vert); border-color: var(--vert); }
  .point.ko { background: var(--rouge); border-color: var(--rouge); }
  .point.bis { border-style: dashed; }
  .point.actuel { transform: scale(1.3); box-shadow: 0 0 0 3px var(--fluo-pale); }
  .etoiles { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 4px; min-width: 64px; justify-content: flex-end; }
  .etoiles svg { width: 26px; height: 26px; }

  .scene {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: var(--blanc);
    border: 2px solid var(--encre);
    border-radius: 22px;
    padding: 24px 18px 28px;
    position: relative;
  }
  .consigne { margin: 0; font-size: 22px; font-weight: 700; text-align: center; text-wrap: balance; }
  .nom-jeu { margin: 0; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--encre-douce); }
  .zone { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .message { min-height: 30px; font-size: 20px; font-weight: 700; text-align: center; }
  .message.ok { color: var(--vert); }
  .message.ko { color: var(--rouge); }

  /* la réglure Seyès du cahier, pour écrire le mot */
  .reglure {
    position: relative;
    width: 100%;
    max-width: 680px;
    min-height: 112px;
    padding: 16px 16px 16px 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px;
    background-color: var(--papier);
    background-image:
      linear-gradient(to right, transparent 36px, var(--marge) 36px 38px, transparent 38px),
      repeating-linear-gradient(to bottom, var(--reglure) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(to bottom, var(--carreau) 0 1px, transparent 1px 7px);
    border-radius: 10px;
  }
  .mot-grand { font-size: clamp(34px, 7vw, 58px); font-weight: 700; line-height: 1.2; letter-spacing: .02em; }
  .det { color: var(--encre-douce); font-weight: 400; }

  .haut-parleur {
    display: inline-flex; align-items: center; gap: 8px;
  }
  .haut-parleur svg { width: 26px; height: 26px; }

  .phrase {
    font-size: clamp(22px, 3.6vw, 30px);
    text-align: center;
    max-width: 640px;
    line-height: 1.5;
    margin: 0;
  }
  .phrase .blanc { display: inline-block; min-width: 3.5em; border-bottom: 3px dashed var(--encre); }

  /* jeu 1 : choix */
  .choix { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 520px; }
  .choix button {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 700;
    padding: 14px 18px;
    border-radius: 16px;
    border: 2px solid var(--encre);
    background: var(--papier);
    box-shadow: var(--ombre);
  }
  .choix button:active { transform: translateY(2px); box-shadow: none; }
  .choix button.faux { background: var(--rouge-pale); border-color: var(--rouge); color: var(--rouge); text-decoration: line-through; box-shadow: none; }
  .choix button.juste { background: var(--vert-pale); border-color: var(--vert); color: var(--vert); }

  /* jeu 2 : lettres cachées */
  .mot-trous { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 2px; }
  .mot-trous .l { font-size: clamp(34px, 7vw, 56px); font-weight: 700; line-height: 1.2; min-width: .3em; text-align: center; }
  .mot-trous .espace { width: .5em; }
  .case {
    font-size: clamp(34px, 7vw, 56px);
    font-weight: 700;
    line-height: 1.2;
    min-width: 1.1em;
    height: 1.35em;
    padding: 0 4px;
    border: none;
    border-bottom: 4px solid var(--encre);
    background: var(--fluo-pale);
    border-radius: 8px 8px 0 0;
  }
  .case.selection { background: var(--fluo); }
  .case.faux { background: var(--rouge-pale); border-color: var(--rouge); color: var(--rouge); }
  .case.juste { background: var(--vert-pale); border-color: var(--vert); color: var(--vert); }

  .banque { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 640px; }
  .tuile {
    min-width: 64px;
    height: 64px;
    padding: 0 14px;
    font-size: 32px;
    font-weight: 700;
    border: 2px solid var(--encre);
    border-radius: 14px;
    background: var(--papier);
    box-shadow: var(--ombre);
  }
  .tuile:active { transform: translateY(2px); box-shadow: none; }
  .tuile.utilisee { visibility: hidden; }

  /* jeu 3 : morceaux */
  .reponse-morceaux { min-height: 112px; }
  .reponse-morceaux .tuile { background: var(--fluo-pale); }
  .reponse-morceaux .vide { color: var(--carreau-fort); font-size: 28px; }

  /* saisie + clavier */
  .saisie { font-size: clamp(34px, 7vw, 56px); font-weight: 700; line-height: 1.2; display: flex; align-items: baseline; flex-wrap: wrap; justify-content: center; }
  .saisie .tape { white-space: pre; }
  .curseur { display: inline-block; width: 3px; height: 1em; background: var(--encre); margin-left: 2px; animation: clignote 1s steps(1) infinite; align-self: center; }
  @keyframes clignote { 50% { opacity: 0; } }
  .modele { font-size: 20px; color: var(--encre-douce); text-align: center; }
  .modele strong { color: var(--vert); font-size: 30px; }

  .clavier { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 8px; }
  .rang { display: flex; gap: 6px; justify-content: center; }
  .touche {
    flex: 1 1 0;
    max-width: 68px;
    height: 58px;
    font-size: 26px;
    border: 2px solid var(--encre);
    border-radius: 10px;
    background: var(--papier);
    box-shadow: 0 2px 0 rgba(29, 52, 128, .25);
    padding: 0;
  }
  .touche:active { transform: translateY(2px); box-shadow: none; background: var(--fluo-pale); }
  .rang.accents .touche { background: var(--fluo-pale); }
  .touche.large { max-width: 110px; flex-grow: 1.6; font-size: 18px; font-weight: 700; }
  .touche.espace { max-width: 300px; flex-grow: 4; font-size: 16px; }
  .touche.valider { max-width: 220px; flex-grow: 3; background: var(--encre); color: var(--blanc); font-size: 20px; font-weight: 700; }
  .touche.maj-active { background: var(--fluo); }

  /* flash */
  .compte { width: 100%; max-width: 420px; height: 10px; border-radius: 5px; background: var(--carreau); overflow: hidden; }
  .compte div { height: 100%; background: var(--fluo); transform-origin: left; }

  /* surligneur quand c'est juste */
  .surligne { position: relative; z-index: 0; }
  .surligne::after {
    content: "";
    position: absolute;
    left: -6px; right: -6px; bottom: 6%;
    height: 45%;
    background: var(--surligneur-vert);
    z-index: -1;
    border-radius: 3px;
    transform-origin: left;
    animation: surligner .45s ease-out both;
  }
  @keyframes surligner { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .surligne.rouge::after { background: var(--surligneur-rouge); }

  /* correction après une erreur */
  .correction { display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 680px; }
  .ligne-corr { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .etiquette { font-size: 17px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--encre-douce); }
  .mot-corr { font-size: clamp(34px, 7vw, 56px); font-weight: 700; line-height: 1.25; }
  .ligne-corr.faux .mot-corr { font-size: clamp(26px, 5vw, 40px); }
  .diff-ko { color: var(--rouge); text-decoration: underline 3px; text-underline-offset: 4px; }
  .diff-ok { color: #16693A; text-decoration: underline 3px; text-underline-offset: 4px; }
  .secoue { animation: secouer .4s; }
  @keyframes secouer { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

  /* fin de série */
  .fin { align-items: center; text-align: center; }
  .tampon {
    font-family: var(--f-titre);
    font-size: clamp(34px, 7vw, 50px);
    color: var(--rouge);
    border: 4px double var(--rouge);
    border-radius: 12px;
    padding: 4px 26px 10px;
    transform: rotate(-6deg);
    animation: tamponner .5s cubic-bezier(.3, 1.6, .5, 1) both;
    margin: 10px 0;
  }
  @keyframes tamponner { from { transform: rotate(-6deg) scale(2.2); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
  .score-fin { font-size: 64px; font-weight: 700; line-height: 1; }
  .score-fin small { font-size: 28px; color: var(--encre-douce); }
  .a-revoir { width: 100%; max-width: 560px; text-align: left; }
  .a-revoir h3 { margin: 0 0 8px; font-size: 20px; }
  .a-revoir ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .a-revoir li { font-size: 24px; font-weight: 700; padding: 4px 12px; border-radius: 8px; background: var(--fluo-pale); }

  /* espace parent */
  .parent { gap: 18px; }
  .panneau { background: var(--blanc); border: 2px solid var(--encre); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .panneau h2 { margin: 0; font-size: 24px; }
  .panneau label { font-weight: 700; font-size: 16px; display: flex; flex-direction: column; gap: 6px; }
  .panneau input[type=text], .panneau textarea { border: 2px solid var(--carreau-fort); border-radius: 10px; padding: 10px 12px; background: var(--papier); font-weight: 400; font-size: 18px; }
  .panneau textarea { min-height: 200px; resize: vertical; line-height: 1.5; }
  .aide { color: var(--encre-douce); font-size: 15px; margin: 0; font-weight: 400; }
  .tableau-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 17px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--carreau-fort); }
  th { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--encre-douce); }
  td.n { text-align: right; }
  .puce-ko { color: var(--rouge); font-weight: 700; }
  .garde { max-width: 420px; align-self: center; width: 100%; text-align: center; }
  .garde .pave { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  @media (max-width: 560px) {
    .touche { height: 48px; font-size: 21px; }
    .rang { gap: 4px; }
    .tuile { min-width: 54px; height: 56px; font-size: 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- le numéro change à chaque ouverture : l'iPad recharge toujours la dernière liste de mots -->
<script>document.write('<script src="mots.js?v=' + Date.now() + '"><\/script>');</script>
<script>
"use strict";

/* =========================================================
   Outils
   ========================================================= */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const alea = n => Math.floor(Math.random() * n);
const choisir = t => t[alea(t.length)];
function melanger(t) { const a = t.slice(); for (let i = a.length - 1; i > 0; i--) { const j = alea(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const attendre = ms => new Promise(r => setTimeout(r, ms));

const Stock = {
  lire(cle, defaut) { try { const v = localStorage.getItem("dictee:" + cle); return v ? JSON.parse(v) : defaut; } catch (e) { return defaut; } },
  ecrire(cle, v) { try { localStorage.setItem("dictee:" + cle, JSON.stringify(v)); } catch (e) {} },
  effacer(cle) { try { localStorage.removeItem("dictee:" + cle); } catch (e) {} }
};

const ICONES = {
  etoile: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8 6.2 20.1l1.4-6.4L2.7 9.3l6.5-.7z" fill="#FFB05C" stroke="#1D3480" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  son: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};

/* =========================================================
   Listes de mots
   ========================================================= */
const PROFILS = ["grande", "petite"];

function lireEntree(brute) {
  const o = typeof brute === "string" ? { mot: brute } : Object.assign({}, brute);
  const texte = String(o.mot).replace(/[’`]/g, "'").replace(/\s+/g, " ").trim();
  let det = "", mot = texte, m;
  if ((m = texte.match(/^(les|le|la|un|une|des)\s+(.+)$/i))) { det = m[1]; mot = m[2]; }
  else if ((m = texte.match(/^(l')(.+)$/i))) { det = m[1]; mot = m[2]; }
  return { id: texte, det, mot, pieges: o.pieges || null, phrase: o.phrase || null };
}
const affiche = e => e.det ? (e.det.endsWith("'") ? e.det + e.mot : e.det + " " + e.mot) : e.mot;
const avecDet = (e, mot) => e.det ? (e.det.endsWith("'") ? e.det + mot : e.det + " " + mot) : mot;

function liste(p) {
  const base = LISTES[p];
  const perso = Stock.lire("liste:" + p, null);
  const src = perso || base;
  return {
    titre: src.titre || base.titre,
    classe: base.classe,
    niveau: base.niveau || (p === "petite" ? 1 : 2),
    entrees: src.mots.map(lireEntree).filter(e => e.mot),
    perso: !!perso
  };
}
function prenom(p) {
  return Stock.lire("prenom:" + p, "") || LISTES[p].prenom || (p === "grande" ? "La grande" : "La petite");
}

/* =========================================================
   Statistiques et tirage des séries
   ========================================================= */
function stats(p) { return Stock.lire("stats:" + p, {}); }
function noterResultat(p, e, reussi) {
  const s = stats(p);
  const x = s[e.id] || { ok: 0, ko: 0, vu: 0 };
  x.vu++;
  if (reussi) x.ok++; else x.ko++;
  s[e.id] = x;
  Stock.ecrire("stats:" + p, s);
}
function tirerSerie(p, n = 10) {
  const st = stats(p);
  const pool = liste(p).entrees.map(e => {
    const s = st[e.id] || { ok: 0, ko: 0, vu: 0 };
    let poids = 1 + 2 * Math.max(0, s.ko - s.ok * 0.5);
    if (!s.vu) poids += 2;
    return { e, poids };
  });
  const serie = [];
  // liste courte : chaque mot revient deux fois dans la série
  if (pool.length < n) {
    const k = Math.min(n, pool.length * 2);
    const tour1 = melanger(pool.map(x => x.e));
    let tour2 = melanger(tour1);
    for (let g = 0; g < 20 && tour2[0] === tour1[tour1.length - 1]; g++) tour2 = melanger(tour1);
    return tour1.concat(tour2).slice(0, k);
  }
  const k = Math.min(n, pool.length);
  while (serie.length < k) {
    const total = pool.reduce((a, b) => a + b.poids, 0);
    let r = Math.random() * total, i = 0;
    for (; i < pool.length - 1; i++) { r -= pool[i].poids; if (r <= 0) break; }
    serie.push(pool.splice(i, 1)[0].e);
  }
  return serie;
}

   Voix et sons

let voixFr = null;
function chercherVoix() {
  if (!("speechSynthesis" in window)) return;
  const toutes = speechSynthesis.getVoices();
  const fr = toutes.filter(v => /^fr[-_]FR/i.test(v.lang));
  voixFr = fr.find(v => /Thomas|Audrey|Aurélie|Marie|Amélie/i.test(v.name)) || fr[0] || toutes.find(v => /^fr/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { chercherVoix(); speechSynthesis.onvoiceschanged = chercherVoix; }

// Safari sur iPad n'accepte de parler qu'après un premier toucher de l'écran :
// on "réveille" la voix au premier contact, en silence.
let voixReveillee = false;
function reveillerVoix() {
  if (voixReveillee || !("speechSynthesis" in window)) return;
  voixReveillee = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
document.addEventListener("touchend", reveillerVoix, true);
document.addEventListener("click", reveillerVoix, true);

let parole = null; // garde une référence, sinon Safari coupe parfois la phrase
function dire(texte, lent) {
  if (!("speechSynthesis" in window)) { message("La voix n'est pas disponible sur cet appareil.", "ko"); return; }
  if (!voixFr) chercherVoix();
  const parler = () => {
    parole = new SpeechSynthesisUtterance(texte);
    parole.lang = "fr-FR";
    if (voixFr) parole.voice = voixFr;
    parole.rate = lent ? 0.55 : 0.85;
    parole.onerror = ev => { if (ev.error !== "interrupted" && ev.error !== "canceled") message("La voix ne répond pas (" + ev.error + ").", "ko"); };
    speechSynthesis.speak(parole);
    if (speechSynthesis.paused) speechSynthesis.resume();
  };
  // Sur iPad, parler juste après avoir coupé la voix fait souvent perdre la phrase
  if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(parler, 150); }
  else parler();
}
function texteDictee(e) {
  const a = affiche(e);
  return e.phrase ? `${a}. ... ${e.phrase.replace("{}", e.mot)} ... ${a}.` : `${a}. ... ${a}.`;
}

let audio = null;
function son(type) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    const notes = type === "ok" ? [660, 990] : type === "fin" ? [523, 659, 784, 1047] : [196, 175];
    notes.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type === "ko" ? "triangle" : "sine";
      o.frequency.value = f;
      const d = t + i * (type === "ko" ? 0.14 : 0.11);
      g.gain.setValueAtTime(0.0001, d);
      g.gain.exponentialRampToValueAtTime(type === "ko" ? 0.12 : 0.2, d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, d + 0.32);
      o.connect(g).connect(audio.destination);
      o.start(d); o.stop(d + 0.35);
    });
  } catch (e) {}
}

/* =========================================================
   Orthographe : pièges, lettres difficiles, syllabes
   ========================================================= */
const VOYELLES = "aeiouyàâäéèêëîïôöùûüœæ";
const estVoyelle = c => !!c && VOYELLES.includes(c.toLowerCase());

// Chaque règle : expression, groupe ciblé (t), et variantes fautives
const REGLES = [
  { re: /([bcdfglmnprt])\1/g, t: 0, alts: c => [c[0]] },                                      // consonne doublée -> simple
  { re: /([aeiouéèêâ])([lmnprtf])(?=[aeiouéèêy])/g, t: 2, alts: c => [c + c] },                 // simple -> doublée
  { re: /é/g, alts: () => ["e", "è"] },
  { re: /è/g, alts: () => ["é", "e"] },
  { re: /ê/g, alts: () => ["è", "e"] },
  { re: /[âà]/g, alts: () => ["a"] },
  { re: /Â/g, alts: () => ["A"] },
  { re: /î/g, alts: () => ["i"] },
  { re: /ô/g, alts: () => ["o"] },
  { re: /û/g, alts: () => ["u"] },
  { re: /ç/g, alts: () => ["c", "ss"] },
  { re: /eau/g, alts: () => ["o", "au"] },
  { re: /([^e]|^)(au)/g, t: 2, alts: () => ["o", "eau"] },
  { re: /ph/g, alts: () => ["f"] },
  { re: /th/g, alts: () => ["t"] },
  { re: /^h/g, alts: () => [""] },
  { re: /(an)(?=[^aeiouyéèên]|$)/g, t: 1, alts: () => ["en"] },
  { re: /(en)(?=[^aeiouyéèên]|$)/g, t: 1, alts: () => ["an"] },
  { re: /(am|em)(?=[bp])/g, t: 1, alts: c => [c[0] + "n", c[0] === "a" ? "en" : "an"] },
  { re: /(om)(?=[bp])/g, t: 1, alts: () => ["on"] },
  { re: /ain/g, alts: () => ["in", "ein"] },
  { re: /ein/g, alts: () => ["ain", "in"] },
  { re: /tion/g, alts: () => ["sion", "ssion"] },
  { re: /(c)(?=[eiéèê])/g, t: 1, alts: () => ["s", "ss"] },
  { re: /([aeiouéè])(s)(?=[aeiouéè])/g, t: 2, alts: () => ["z", "ss"] },
  { re: /([aeiou])(ss)(?=[aeiouéè])/g, t: 2, alts: () => ["s", "c"] },
  { re: /(g)(?=[eiéè])/g, t: 1, alts: () => ["j"] },
  { re: /qu/g, alts: () => ["k", "c"] },
  { re: /([stdxp])$/g, t: 1, alts: () => [""] },
  { re: /([^aeiouéè])(e)$/g, t: 2, alts: () => [""] },
  { re: /er$/g, alts: () => ["é", "ez"] },
  { re: /é$/g, alts: () => ["er", "ée"] },
  { re: /y/g, alts: () => ["i"] },
  { re: /ai/g, alts: () => ["è", "é"] },
  { re: /([iouéu])$/g, t: 1, alts: c => [c + "s", c + "t"] }
];

function variantes(w) {
  const sortie = [];
  REGLES.forEach((r, ri) => {
    const re = new RegExp(r.re.source, "g");
    let m;
    while ((m = re.exec(w))) {
      const t = r.t || 0;
      let pos = m.index;
      for (let g = 1; g < t; g++) pos += (m[g] || "").length;
      const cible = t ? m[t] : m[0];
      r.alts(cible).forEach(a => {
        const v = w.slice(0, pos) + a + w.slice(pos + cible.length);
        if (v !== w && v.replace(/[\s']/g, "").length > 1) sortie.push({ v, ri });
      });
      if (m[0].length === 0) re.lastIndex++;
    }
  });
  return sortie;
}

function inventerPieges(w, n) {
  const toutes = melanger(variantes(w));
  const pris = [], regles = new Set();
  for (const x of toutes) if (pris.length < n && !regles.has(x.ri) && !pris.includes(x.v)) { pris.push(x.v); regles.add(x.ri); }
  for (const x of toutes) if (pris.length < n && !pris.includes(x.v)) pris.push(x.v);
  let garde = 0;
  while (pris.length < n && garde++ < 30) {
    const lettres = [...w].map((c, i) => i).filter(i => /\p{L}/u.test(w[i]));
    const i = choisir(lettres);
    const v = Math.random() < 0.5 ? w.slice(0, i) + w[i] + w.slice(i) : w.slice(0, i) + w.slice(i + 1);
    if (v !== w && v.length > 1 && !pris.includes(v)) pris.push(v);
  }
  return pris.slice(0, n);
}
function piegesPour(e, n = 2) {
  if (e.pieges && e.pieges.length >= n) return melanger(e.pieges).slice(0, n);
  const deja = e.pieges ? e.pieges.slice() : [];
  return deja.concat(inventerPieges(e.mot, n + 2).filter(v => !deja.includes(v))).slice(0, n);
}

// Positions des lettres "à piège" dans un mot
function lettresDifficiles(w) {
  const bas = w.toLowerCase();
  const res = new Set();
  const marquer = (re, f) => { let m; const r = new RegExp(re.source, "g"); while ((m = r.exec(bas))) { f(m).forEach(i => res.add(i)); if (!m[0].length) r.lastIndex++; } };
  marquer(/([bcdfglmnprst])\1/, m => [m.index, m.index + 1]);
  marquer(/[éèêëàâîïôûùç]/, m => [m.index]);
  marquer(/eau/, m => [m.index, m.index + 1, m.index + 2]);
  marquer(/au|ai|ei/, m => [m.index, m.index + 1]);
  marquer(/[pt]h/, m => [m.index + 1]);
  marquer(/^h|'h/, m => [m.index + m[0].length - 1]);
  marquer(/[aeo][nm](?=[^aeiouyéèên]|$)/, m => [m.index, m.index + 1]);
  marquer(/tion/, m => [m.index]);
  marquer(/c(?=[eiéèê])/, m => [m.index]);
  marquer(/g(?=[eiéè])/, m => [m.index]);
  marquer(/qu/, m => [m.index, m.index + 1]);
  marquer(/y/, m => [m.index]);
  marquer(/[stdxp]$/, m => [m.index]);
  marquer(/[^aeiouéè]e$/, m => [m.index + 1]);
  return [...res].filter(i => /\p{Ll}/u.test(w[i]));
}

// Découpage en syllabes écrites (ca-thé-dra-le)
const INSEPARABLES = ["bl", "br", "cl", "cr", "dr", "fl", "fr", "gl", "gr", "pl", "pr", "tr", "vr"];
function syllabesMot(w) {
  const bas = w.toLowerCase();
  const u = [];
  for (let i = 0; i < w.length;) {
    const deux = bas.slice(i, i + 2);
    if (["ch", "ph", "th", "gn", "qu"].includes(deux) || (deux === "gu" && estVoyelle(bas[i + 2]))) { u.push({ t: w.slice(i, i + 2), v: false }); i += 2; continue; }
    let v = estVoyelle(bas[i]);
    if (bas[i] === "y" && estVoyelle(bas[i - 1]) && estVoyelle(bas[i + 1])) v = false;
    u.push({ t: w[i], v }); i++;
  }
  const noyaux = [];
  u.forEach((x, k) => {
    if (!x.v) return;
    const der = noyaux[noyaux.length - 1];
    if (der && der.fin === k - 1) der.fin = k; else noyaux.push({ debut: k, fin: k });
  });
  if (noyaux.length < 2) return [w];
  const coupes = [];
  for (let n = 0; n < noyaux.length - 1; n++) {
    const a = noyaux[n].fin + 1, b = noyaux[n + 1].debut;
    const cons = u.slice(a, b);
    const apo = cons.findIndex(x => x.t === "'");
    let c;
    if (apo > 0) c = a + apo - 1;
    else if (cons.length <= 1) c = a;
    else {
      const fin2 = (cons[cons.length - 2].t + cons[cons.length - 1].t).toLowerCase();
      c = INSEPARABLES.includes(fin2) ? b - 2 : b - 1;
    }
    coupes.push(c);
  }
  const syl = [];
  let deb = 0;
  coupes.concat([u.length]).forEach(c => { syl.push(u.slice(deb, c).map(x => x.t).join("")); deb = c; });
  return syl.filter(Boolean);
}
const syllabes = mot => mot.split(" ").flatMap(syllabesMot);

function lancerPartie(p, jeu) {
  const serie = tirerSerie(p);

  S = { p, jeu, niveau: liste(p).niveau, serie, total: serie.length, etats: [], i: 0, points: 0, resultats: [] };
  if (!S.serie.length) { ecranMenu(p); return; }

}

function motSuivant() {

      }).join("")}</div>

}

function consigne(t) { document.getElementById("consigne").textContent = t; }
function message(t, classe) {

  if (!m) return;
  m.textContent = t; m.className = "message" + (classe ? " " + classe : "");
}

const BRAVOS = ["Bravo !", "Super !", "Parfait !", "Génial !", "Excellent !", "Oui !"];
function gagne(e, cibleSurligne) {
  if (S.fini) return;
  S.fini = true;
  const bis = S.i >= S.total;
  if (!bis) { S.points++; S.resultats.push({ e, ok: true }); }
  S.etats[S.i] = true;
  noterResultat(S.p, e, true);
  son("ok");
  message(bis ? "Cette fois, c'est juste !" : choisir(BRAVOS), "ok");
  if (cibleSurligne) cibleSurligne.classList.add("surligne");
  plusTard(passer, 1300);
}

// Lettres communes aux deux mots (plus longue sous-suite commune)
function lettresCommunes(a, b) {
  const A = [...a], B = [...b], n = A.length, m = B.length;
  const t = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i][j] = A[i] === B[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
  const okA = new Array(n).fill(false), okB = new Array(m).fill(false);
  for (let i = 0, j = 0; i < n && j < m;) {
    if (A[i] === B[j]) { okA[i] = okB[j] = true; i++; j++; }
    else if (t[i + 1][j] >= t[i][j + 1]) i++; else j++;
  }
  return { A, B, okA, okB };
}

// Erreur : on montre la correction, puis on passe au mot suivant
function echec(e, tentative, verbe) {
  if (S.fini) return;
  S.fini = true;
  const bis = S.i >= S.total;
  // au plus 5 deuxièmes chances par série, pour ne pas la rallonger à l'infini
  const rejoue = !bis && S.serie.length - S.total < 5;
  if (!bis) { S.resultats.push({ e, ok: false }); if (rejoue) S.serie.push(e); }
  S.etats[S.i] = false;
  noterResultat(S.p, e, false);
  son("ko");
  const { A, B, okA, okB } = lettresCommunes(tentative, e.mot);
  const marquer = (L, ok, cls) => L.map((c, k) => ok[k] ? esc(c) : `<span class="${cls}">${esc(c)}</span>`).join("");
  const det = e.det ? (e.det.endsWith("'") ? e.det : e.det + " ") : "";
  consigne("Regarde bien la correction");
  const zone = document.getElementById("zone");
  zone.innerHTML = `
    <div class="correction">
      <div class="ligne-corr faux">
        <span class="etiquette">${verbe}</span>
        <span class="mot-corr surligne rouge">${esc(det)}${marquer(A, okA, "diff-ko")}</span>
      </div>
      <div class="reglure ligne-corr juste">
        <span class="etiquette">Il fallait écrire</span>
        <span class="mot-corr surligne">${esc(det)}${marquer(B, okB, "diff-ok")}</span>
      </div>
    </div>
    <button class="bouton plein" id="compris">J'ai compris →</button>
  `;
  message(rejoue ? "Pas grave ! Ce mot reviendra à la fin de la série." : "Pas grave ! Ce mot reviendra dans une prochaine partie.", "ko");
  document.getElementById("compris").onclick = passer;
  plusTard(() => dire(affiche(e)), 300);
}

function passer() {
  S.i++;
  if (S.i >= S.serie.length) ecranFin(); else motSuivant();
}

/* ---------- Fin de série ---------- */
function ecranFin() {
  const { p, jeu, points } = S;
  const sur = S.total;
  const cle = `record:${p}:${jeu}`;
  const rec = Stock.lire(cle, null);
  const nouveau = !rec || points / sur > rec.points / rec.sur;
  if (nouveau) Stock.ecrire(cle, { points, sur });
  const ratio = points / sur;
  const tampon = ratio >= 0.9 ? "Excellent !" : ratio >= 0.7 ? "Très bien !" : ratio >= 0.5 ? "Bien !" : "Continue !";
  const aRevoir = S.resultats.filter(r => !r.ok).map(r => r.e);
  afficher(`
    <main class="scene fin">
      <div class="tampon">${tampon}</div>
      <div class="score-fin">${points}<small> / ${sur}</small></div>
      <p class="sous-titre">${nouveau && points > 0 ? "Nouveau record !" : `${esc(prenom(p))}, tu as gagné ${points} étoile${points > 1 ? "s" : ""}.`}</p>
      ${aRevoir.length ? `<div class="a-revoir"><h3>Les mots à revoir</h3><ul>${aRevoir.map(e => `<li>${esc(affiche(e))}</li>`).join("")}</ul></div>` : ""}
      <div class="ligne-boutons">
        <button class="bouton plein" id="rejouer">Rejouer</button>
        <button class="bouton" id="menu">Choisir un autre jeu</button>
      </div>
    </main>
  `);
  son("fin");
  document.getElementById("rejouer").onclick = () => lancerPartie(p, jeu);
  document.getElementById("menu").onclick = () => ecranMenu(p);
}

const MOTEURS = {};

/* ---------- 1. Le bon mot ---------- */
MOTEURS.choix = (e, zone) => {

};

/* ---------- 2. Les lettres cachées ---------- */
const CONFUSIONS = { a: "eâà", à: "aâ", â: "aà", e: "éè", é: "eèê", è: "éeê", ê: "èé", ë: "eé", i: "îy", î: "i", ï: "i", o: "ô", ô: "o", u: "ûù", û: "u", ù: "u", c: "sçk", ç: "cs", s: "czx", z: "s", m: "n", n: "m", t: "d", d: "t", p: "b", b: "p", f: "v", v: "f", g: "j", j: "g", q: "k", k: "c", x: "s", h: "e", l: "r", r: "l", y: "i" };

MOTEURS.trous = (e, zone) => {
  consigne("Remets les lettres qui manquent");
  const w = e.mot;
  const lettres = [...w].map((c, i) => i).filter(i => /\p{Ll}/u.test(w[i]));
  const nb = Math.max(1, Math.min(lettres.length - 1, S.niveau === 1 ? (w.length <= 4 ? 1 : 2) : (w.length <= 4 ? 1 : w.length <= 7 ? 2 : 3)));
  const cleMemo = `trous:${S.p}:${e.id}`;
  const avant = Stock.lire(cleMemo, "");
  let trous = [];
  for (let essai = 0; essai < 12; essai++) {
    const diff = melanger(lettresDifficiles(w));
    const autres = melanger(lettres.filter(i => !diff.includes(i)));
    let pris = diff.slice(0, nb);
    if (pris.length && Math.random() < 0.3 && autres.length) pris[pris.length - 1] = autres[0];
    for (const i of autres) if (pris.length < nb) pris.push(i);
    pris = [...new Set(pris)].sort((a, b) => a - b);
    trous = pris;
    if (pris.join(",") !== avant) break;
  }
  Stock.ecrire(cleMemo, trous.join(","));

  const manquantes = trous.map(i => w[i]);
  const leurres = [];
  manquantes.forEach(c => {
    const pistes = (CONFUSIONS[c] || "").split("").filter(x => !manquantes.includes(x) && !leurres.includes(x));
    if (pistes.length) leurres.push(choisir(pistes));
  });
  while (leurres.length < Math.max(3, manquantes.length + 1)) {
    const x = choisir("aeéèioustrnlmcp".split(""));
    if (!manquantes.includes(x) && !leurres.includes(x)) leurres.push(x);
  }
  const banque = melanger(manquantes.concat(leurres.slice(0, Math.max(3, manquantes.length + 1))));

  const remplis = {}; // position -> index tuile
  let selection = trous[0];

  zone.innerHTML = `
    <div class="reglure"><div class="mot-trous" id="mot">
      ${e.det ? `<span class="l det">${esc(e.det)}</span>${e.det.endsWith("'") ? "" : '<span class="espace"></span>'}` : ""}
      ${[...w].map((c, i) => trous.includes(i)
        ? `<button class="case" data-pos="${i}" aria-label="lettre manquante"></button>`
        : c === " " ? '<span class="espace"></span>' : `<span class="l">${esc(c)}</span>`).join("")}
    </div></div>
    <div class="banque">${banque.map((c, k) => `<button class="tuile" data-k="${k}">${esc(c)}</button>`).join("")}</div>
    <button class="bouton haut-parleur" id="ecouter">${ICONES.son} Écouter le mot</button>
  `;
  const mot = zone.querySelector("#mot");
  zone.querySelector("#ecouter").onclick = () => dire(affiche(e));

  function dessiner() {
    zone.querySelectorAll(".case").forEach(b => {
      const pos = +b.dataset.pos;
      b.textContent = remplis[pos] !== undefined ? banque[remplis[pos]] : "";
      b.classList.toggle("selection", pos === selection && !S.fini);
    });
    const utilisees = Object.values(remplis);
    zone.querySelectorAll(".tuile").forEach(t => t.classList.toggle("utilisee", utilisees.includes(+t.dataset.k)));
  }
  function verifier() {
    if (trous.some(i => remplis[i] === undefined)) return;
    const fautes = trous.filter(i => banque[remplis[i]] !== w[i]);
    if (!fautes.length) {
      zone.querySelectorAll(".case").forEach(b => b.classList.add("juste"));
      dessiner();
      gagne(e, mot);
      return;
    }
    fautes.forEach(i => zone.querySelector(`.case[data-pos="${i}"]`).classList.add("faux"));
    secouer(mot);
    const tentative = [...w].map((c, i) => trous.includes(i) ? banque[remplis[i]] : c).join("");
    S.fini = true;
    plusTard(() => { S.fini = false; echec(e, tentative, "Tu as écrit"); }, 900);
  }
  zone.querySelectorAll(".case").forEach(b => b.onclick = () => {
    if (S.fini) return;
    const pos = +b.dataset.pos;
    if (remplis[pos] !== undefined) delete remplis[pos];
    selection = pos;
    dessiner();
  });
  zone.querySelectorAll(".tuile").forEach(t => t.onclick = () => {
    if (S.fini) return;
    const k = +t.dataset.k;
    if (Object.values(remplis).includes(k)) return;
    let pos = remplis[selection] === undefined ? selection : trous.find(i => remplis[i] === undefined);
    if (pos === undefined) return;
    remplis[pos] = k;
    selection = trous.find(i => remplis[i] === undefined);
    dessiner();
    verifier();
  });
  dessiner();
};

/* ---------- 3. Le mot en morceaux ---------- */
MOTEURS.morceaux = (e, zone) => {
  const w = e.mot;
  const syl = syllabes(w);
  const parLettres = syl.length < 3 || (S.niveau === 1 && w.replace(/\s/g, "").length <= 8);
  const morceaux = parLettres ? [...w.replace(/\s/g, "")] : syl;
  consigne(parLettres ? "Remets les lettres dans l'ordre" : "Remets les syllabes dans l'ordre");
  const cible = morceaux.join("");
  let ordre = melanger(morceaux.map((_, k) => k));
  for (let g = 0; g < 10 && ordre.map(k => morceaux[k]).join("") === cible; g++) ordre = melanger(ordre);
  const place = []; // indices de tuiles posées

  zone.innerHTML = `
    <div class="reglure reponse-morceaux" id="reponse"></div>
    <div class="banque" id="banque"></div>
    <button class="bouton haut-parleur" id="ecouter">${ICONES.son} Écouter le mot</button>
  `;
  const rep = zone.querySelector("#reponse"), banque = zone.querySelector("#banque");
  zone.querySelector("#ecouter").onclick = () => dire(affiche(e));

  function dessiner() {
    rep.innerHTML = (e.det ? `<span class="mot-grand det">${esc(e.det)}</span>` : "") +
      (place.length ? place.map((k, n) => `<button class="tuile" data-n="${n}">${esc(morceaux[k])}</button>`).join("") : '<span class="vide">touche les morceaux</span>');
    banque.innerHTML = ordre.map(k => `<button class="tuile${place.includes(k) ? " utilisee" : ""}" data-k="${k}">${esc(morceaux[k])}</button>`).join("");
    rep.querySelectorAll(".tuile").forEach(t => t.onclick = () => { if (S.fini) return; place.splice(+t.dataset.n, 1); dessiner(); });
    banque.querySelectorAll(".tuile").forEach(t => t.onclick = () => {
      if (S.fini) return;
      const k = +t.dataset.k;
      if (place.includes(k)) return;
      place.push(k); dessiner();
      if (place.length === morceaux.length) verifier();
    });
  }
  function verifier() {
    const essai = place.map(k => morceaux[k]).join("");
    if (essai === cible) {
      rep.innerHTML = `<span class="mot-grand">${esc(affiche(e))}</span>`;
      gagne(e, rep.querySelector(".mot-grand"));
      return;
    }
    secouer(rep);
    S.fini = true;
    plusTard(() => { S.fini = false; echec(e, essai, "Tu as écrit"); }, 900);
  }
  dessiner();
};

/* ---------- Clavier (dictée et flash) ---------- */
function clavier(zone, { prefixe, onValider }) {
  let valeur = "", maj = false;
  const RANGS = [
    ["é", "è", "ê", "à", "â", "ç", "ù", "û", "î", "ï", "ô", "ë", "œ"],
    ["a", "z", "e", "r", "t", "y", "u", "i", "o", "p"],
    ["q", "s", "d", "f", "g", "h", "j", "k", "l", "m"],
    ["⇧", "w", "x", "c", "v", "b", "n", "'", "-", "⌫"],
    ["espace", "Valider"]
  ];
  const ligne = document.createElement("div");
  ligne.className = "reglure";
  ligne.innerHTML = `<div class="saisie">${prefixe ? `<span class="det">${esc(prefixe)}</span>` : ""}<span class="tape"></span><span class="curseur"></span></div>`;
  const cl = document.createElement("div");
  cl.className = "clavier";
  cl.innerHTML = RANGS.map((r, i) => `<div class="rang${i === 0 ? " accents" : ""}">${r.map(k => {
    const cls = k === "⇧" || k === "⌫" ? " large" : k === "espace" ? " espace" : k === "Valider" ? " valider" : "";
    return `<button class="touche${cls}" data-k="${esc(k)}" aria-label="${k === "⇧" ? "majuscule" : k === "⌫" ? "effacer" : esc(k)}">${esc(k)}</button>`;
  }).join("")}</div>`).join("");
  zone.appendChild(ligne);
  zone.appendChild(cl);
  const tape = ligne.querySelector(".tape");
  const toucheMaj = cl.querySelector('[data-k="⇧"]');

  function maj_(v) { maj = v; toucheMaj.classList.toggle("maj-active", maj); cl.querySelectorAll(".touche").forEach(t => { const k = t.dataset.k; if (k.length === 1 && /\p{L}/u.test(k)) t.textContent = maj ? k.toUpperCase() : k; }); }
  function frappe(k) {
    if (k === "Valider") { if (valeur.trim()) onValider(valeur.trim()); return; }
    if (k === "⌫") valeur = valeur.slice(0, -1);
    else if (k === "⇧") { maj_(!maj); return; }
    else if (k === "espace") valeur += " ";
    else { valeur += maj ? k.toUpperCase() : k; if (maj) maj_(false); }
    tape.textContent = valeur;
  }
  cl.querySelectorAll(".touche").forEach(t => t.onclick = () => frappe(t.dataset.k));
  document.onkeydown = ev => {
    if (ev.key === "Enter") frappe("Valider");
    else if (ev.key === "Backspace") frappe("⌫");
    else if (ev.key === " ") { ev.preventDefault(); frappe("espace"); }
    else if (ev.key.length === 1) { valeur += ev.key; tape.textContent = valeur; }
  };
  return {
    vider() { valeur = ""; tape.textContent = ""; },
    ligne
  };
}

// « oe » tapé à la place de « œ » est accepté
const normal = s => s.replace(/[’`]/g, "'").replace(/oe/g, "œ").replace(/OE|Oe/g, "Œ").replace(/\s+/g, " ").trim();
function comparer(saisi, e) {
  const a = normal(saisi), b = normal(e.mot);
  if (a === b) return "ok";
  if (a.toLowerCase() === b.toLowerCase()) return "maj";
  const avecArticle = normal(affiche(e));
  if (a === avecArticle) return "ok";
  return "ko";
}

/* ---------- 4. La dictée ---------- */
MOTEURS.dictee = (e, zone) => {
  consigne("Écoute bien, puis écris le mot");
  zone.innerHTML = `
    <div class="ligne-boutons">
      <button class="bouton plein haut-parleur" id="ecouter">${ICONES.son} Écouter</button>
      <button class="bouton" id="lent">Plus lentement</button>
    </div>
  `;
  zone.querySelector("#ecouter").onclick = () => dire(texteDictee(e));
  zone.querySelector("#lent").onclick = () => dire(affiche(e), true);
  const c = clavier(zone, {
    prefixe: e.det ? (e.det.endsWith("'") ? e.det : e.det + " ") : "",
    onValider(v) {
      if (S.fini) return;
      const r = comparer(v, e);
      if (r === "ok") { gagne(e, c.ligne.querySelector(".saisie")); return; }
      if (r === "maj") { message("Presque ! Attention à la majuscule.", "ko"); return; }
      echec(e, v, "Tu as écrit");
    }
  });
  plusTard(() => dire(texteDictee(e)), 400);
};

/* ---------- 5. Le flash ---------- */
MOTEURS.flash = (e, zone) => {
  const duree = S.niveau === 1 ? 3500 + 120 * e.mot.length : 2400 + 90 * e.mot.length;
  function montrer() {
    consigne("Regarde bien ce mot…");
    message("");
    zone.innerHTML = `
      <div class="reglure"><span class="mot-grand">${esc(affiche(e))}</span></div>
      <div class="compte"><div id="barre-compte"></div></div>
    `;
    const barre = zone.querySelector("#barre-compte");
    barre.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: duree, fill: "forwards" });
    plusTard(ecrire, duree);
  }
  function ecrire() {
    consigne("À toi ! Écris le mot de mémoire");
    zone.innerHTML = "";
    const c = clavier(zone, {
      prefixe: e.det ? (e.det.endsWith("'") ? e.det : e.det + " ") : "",
      onValider(v) {
        if (S.fini) return;
        const r = comparer(v, e);
        if (r === "ok") { gagne(e, c.ligne.querySelector(".saisie")); return; }
        if (r === "maj") { message("Presque ! Attention à la majuscule.", "ko"); return; }
        echec(e, v, "Tu as écrit");
      }
    });
  }
  montrer();
};

function ecranGarde() {
  const a = 3 + alea(7), b = 4 + alea(6), juste = a * b;
  const propositions = melanger([juste, juste + a, juste - b, juste + 1 + alea(3), a + b, juste + 10].filter((v, i, t) => t.indexOf(v) === i)).slice(0, 5);
  if (!propositions.includes(juste)) propositions[0] = juste;
  afficher(`
    <main class="scene garde">
      <p class="nom-jeu">Espace parent</p>
      <p class="consigne">Combien font ${a} × ${b} ?</p>
      <div class="pave">${melanger(propositions).map(v => `<button class="tuile" data-v="${v}">${v}</button>`).join("")}<button class="tuile" id="annuler" style="font-size:18px">Retour</button></div>
    </main>
  `);
  app.querySelectorAll("[data-v]").forEach(x => x.onclick = () => +x.dataset.v === juste ? ecranParent() : ecranAccueil());
  document.getElementById("annuler").onclick = ecranAccueil;
}

function ecranParent() {
  afficher(`
    <div class="menu-tete">
      <button class="bouton" id="retour">← Retour au jeu</button>
      <div class="qui"><strong>Espace parent</strong><span>Listes de mots et progrès</span></div>
    </div>

      : "Aucune voix française trouvée pour l'instant. Touche « Tester la voix ».";
  };
  etatVoix();
  document.getElementById("tester-voix").onclick = () => { dire("Bonjour ! Nous visitons la cathédrale de Reims."); setTimeout(etatVoix, 500); };
  PROFILS.forEach(p => {

      Stock.ecrire("prenom:" + p, q(".champ-prenom").value.trim());

      const officiels = base.mots.map(m => ({ id: lireEntree(m).id, m }));
      if (!identique && mots.length) Stock.ecrire("liste:" + p, { titre: titre || "Ma liste", mots: mots.map(id => (officiels.find(x => x.id === lireEntree(id).id) || { m: id }).m) });
      if (identique) Stock.effacer("liste:" + p);
      q(".etat").textContent = "Enregistré sur cet appareil.";
    };
    const off = q(".officielle");
    if (off) off.onclick = () => { Stock.effacer("liste:" + p); ecranParent(); };
    const raz = q(".raz");
    raz.onclick = () => {
      if (raz.dataset.confirme) { Stock.effacer("stats:" + p); JEUX.forEach(j => Stock.effacer(`record:${p}:${j.id}`)); ecranParent(); }
      else { raz.dataset.confirme = "1"; raz.textContent = "Touche encore pour confirmer"; }
    };
  });
}

function panneauParent(p) {
  const l = liste(p);
  const st = stats(p);
  const lignes = l.entrees.map(e => ({ e, s: st[e.id] || { ok: 0, ko: 0, vu: 0 } }))
    .sort((a, b) => (b.s.ko - b.s.ok * 0.5) - (a.s.ko - a.s.ok * 0.5) || b.s.vu - a.s.vu);
  const joues = lignes.filter(x => x.s.vu);
  return `
    <section class="panneau" data-panneau="${p}">
      <h2>${esc(prenom(p))} · ${esc(l.classe)}</h2>

      <label>Titre de la liste<input type="text" class="champ-titre" id="titre-${p}" value="${esc(l.titre)}"></label>
      <label>Mots (un par ligne, avec le déterminant si besoin)
        <textarea class="champ-mots" id="mots-${p}">${esc(l.entrees.map(e => e.id).join("\n"))}</textarea>
      </label>
      <p class="aide">${l.perso ? "Cette liste a été modifiée sur cet appareil." : "C'est la liste officielle, celle du site."} Une liste tapée ici ne vaut que pour cet iPad.</p>
      <div class="ligne-boutons" style="justify-content:flex-start">
        <button class="bouton plein enregistrer">Enregistrer</button>
        ${l.perso ? '<button class="bouton officielle">Revenir à la liste officielle</button>' : ""}
        <span class="etat aide" style="align-self:center"></span>
      </div>
      <h2 style="font-size:20px;margin-top:8px">Progrès cette semaine</h2>
      ${joues.length ? `<div class="tableau-wrap"><table>
        <thead><tr><th>Mot</th><th class="n">Réussi</th><th class="n">Raté</th></tr></thead>
        <tbody>${lignes.map(x => `<tr><td>${esc(x.e.id)}</td><td class="n">${x.s.ok}</td><td class="n${x.s.ko > x.s.ok ? " puce-ko" : ""}">${x.s.ko}</td></tr>`).join("")}</tbody>
      </table></div>` : '<p class="aide">Aucune partie jouée pour l\'instant.</p>'}
      <div><button class="bouton discret raz">Remettre les scores à zéro</button></div>
    </section>
  `;
}

ecranAccueil();

// Mode hors ligne : garde une copie du jeu et de la liste sur l'appareil
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
