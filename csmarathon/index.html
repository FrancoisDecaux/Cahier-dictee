img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.05}
.col{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.sheet{background:var(--paper);flex:1;padding:28px 22px 40px;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 18px 50px rgba(0,0,0,.45)}
@media (min-width:700px){.col{padding:28px 0 40px}.sheet{padding:44px 56px 56px}}

/* Bandeau fiche de personnage */
.hud{position:sticky;top:0;z-index:5;width:100%;border:0;background:var(--wall);color:var(--paper);display:flex;align-items:center;gap:14px;padding:9px 16px;font-family:var(--font-display);text-align:left;border-bottom:3px solid var(--rust)}
.hud .lbl{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#b9c4c7;font-weight:500}
.hud b{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.hud-chap{min-width:54px}
.hud-energy{flex:1;min-width:0}
.hud-energy .row{display:flex;align-items:center;gap:8px}
.track{position:relative;flex:1;height:6px;background:#49585e;border-radius:3px}
.track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#93a2a6}
.track i{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ochre);border:2px solid var(--paper);transition:left .5s cubic-bezier(.3,1.4,.5,1)}
.hud-tro{display:flex;align-items:center;gap:6px}
.hud-tro img{width:26px;height:26px}
.hud-more{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid #7f8f94;border-radius:3px;padding:5px 7px 3px;color:#dfe6e8}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5);color:var(--ochre)}100%{transform:scale(1)}}
.bump{display:inline-block;animation:bump .7s ease}

/* Chapitre */
.eyebrow{display:block;font-family:var(--font-display);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.chap-head{text-align:center;margin:6px 0 22px}
.num{font-size:92px;font-weight:800;color:var(--rust);letter-spacing:-.03em;line-height:.9;margin-top:6px}
.chap p{margin:0 0 1.05em;max-width:62ch}
.ill{margin:0 -22px 24px}
@media (min-width:700px){.ill{margin:0 0 28px}}
.ill img{width:100%}
.ill figcaption{background:var(--wall);color:var(--paper);font-style:italic;font-size:15px;padding:10px 16px;text-align:center}
p.fx{border-left:5px solid var(--ochre);background:var(--paper-deep);padding:10px 14px;font-weight:600}
.chip{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:3px;padding:5px 8px 2px;white-space:nowrap;vertical-align:middle}
.chip.gain{background:#2f6b4a}.chip.loss{background:var(--rust)}

/* Indication de jeu */
.cue{margin-top:30px;border-top:2px dashed var(--ink);padding-top:20px}
.cue-t{font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--rust);margin-bottom:10px}
.cue-q{font-weight:600;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:13px 14px;line-height:1.35;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.opt:hover{background:#fff8e6}
.opt:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;background:var(--rust);color:#fff;border:2px solid var(--ink);border-radius:4px;padding:15px 20px 12px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.wide{width:100%}
.btn.quiet{background:var(--paper);color:var(--ink)}
.btn[aria-disabled="true"]{background:#b9b1a2;color:#f4efe3;box-shadow:none;cursor:not-allowed}
.btn .chip{background:rgba(0,0,0,.28)}
.rules{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rules li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 12px;border:1px solid #c9bfa9;border-radius:4px;background:#faf6ec}
.rules li.off{opacity:.42}
.rules li.on{border:2px solid var(--ink);background:#fff3c9;font-weight:600}
.rules .to{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.result{font-family:var(--font-display);font-size:20px;font-weight:700;margin:14px 0 0}
.result b{color:var(--rust);font-size:30px}

/* Grille du hasard, reprise de la dernière page du livre */
.grid{display:grid;grid-template-columns:repeat(8,1fr);border:2px solid var(--ink);background:#fff;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;margin:0 0 16px;max-width:420px}
.grid span{display:flex;align-items:center;justify-content:center;height:27px;padding-top:3px;font-size:15px;border-right:1px solid #b5ab96;border-bottom:1px solid #b5ab96}
.grid span:nth-child(8n){border-right:0}
.grid span.scan{background:var(--ochre)}
.grid span.hit{background:var(--rust);color:#fff;transform:scale(1.35);box-shadow:0 0 0 2px var(--ink);position:relative;z-index:1;transition:transform .25s}
.grid.done span:not(.hit){color:#a79f90}

/* Niveau de compétence et jauge */
.boxes{display:inline-flex;gap:5px;vertical-align:middle}
.boxes i{width:20px;height:20px;border:2px solid var(--ink);background:#fff;display:block}
.boxes i.f{background:var(--ink)}
.mine{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 6px;font-weight:600}
.gauge{position:relative;height:44px;margin:6px 6px 4px}
.gauge .line{position:absolute;left:0;right:0;top:14px;height:3px;background:var(--ink)}
.gauge .tick{position:absolute;top:8px;width:2px;height:15px;background:var(--ink);margin-left:-1px}
.gauge .tick.minor{top:11px;height:9px;width:1px;background:#6d665a}
.gauge .lab{position:absolute;top:26px;font-family:var(--font-display);font-size:13px;font-weight:700;transform:translateX(-50%)}
.gauge .dot{position:absolute;top:4px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--ochre);border:3px solid var(--ink)}

/* Fin de partie */
.stamp{display:inline-block;font-family:var(--font-display);font-weight:800;font-size:34px;letter-spacing:.06em;text-transform:uppercase;color:var(--rust);border:5px solid var(--rust);border-radius:6px;padding:12px 18px 6px;transform:rotate(-4deg);margin:10px 0 22px}
.award{display:flex;align-items:center;gap:16px;background:var(--wall);color:var(--paper);padding:16px;border-radius:6px;margin:0 0 18px}
.award img{width:84px;height:84px;flex:none}
.award strong{font-family:var(--font-display);font-size:24px;display:block;line-height:1.1}
.note{border:2px dashed var(--wall-soft);background:#eef1f0;color:#2c373c;font-size:15px;line-height:1.45;padding:10px 14px;border-radius:4px;margin:0 0 20px}
.note b{font-family:var(--font-display);letter-spacing:.1em;text-transform:uppercase;font-size:12px;display:block;margin-bottom:2px}

.home .cover{height:min(60vh,620px);min-height:300px;width:auto;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 22px 60px rgba(0,0,0,.7)}
.home .intro{max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.home p{margin:0;font-size:16.5px;line-height:1.5}
.home .by{font-family:var(--font-display);letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#c9d2d4}
.home .tag{background:var(--ochre);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px 3px;border-radius:3px}
.home .stack{width:100%;margin-top:4px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.buy{display:flex;gap:16px;align-items:center;margin:0 0 6px}
.buy img{width:104px;flex:none;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.buy div{flex:1;display:flex;flex-direction:column;gap:10px}
.buy p{margin:0;font-size:16px;line-height:1.4}

/* Fiche de personnage */
.title{font-size:34px;font-weight:800;margin-bottom:6px}
.sub{color:var(--ink-soft);margin:0 0 22px;font-size:16px;line-height:1.45}
.skill{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #cfc5ae}
.skill .name{font-weight:600}
.pick{display:flex;gap:6px}
.pick button{width:38px;height:38px;border:2px solid var(--ink);background:#fff;border-radius:3px;padding:0}
.pick button.f{background:var(--ink)}
.left{font-family:var(--font-display);font-weight:700;font-size:18px;margin:18px 0}
.left b{color:var(--rust);font-size:28px}
.sec{font-family:var(--font-display);font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--rust);margin:26px 0 10px}
.tally{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:34px}
.tally svg{height:34px;width:auto}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;text-align:center;font-size:12.5px;line-height:1.2}
.medals img{width:58px;height:58px;margin:0 auto 4px}
.medals .no img{filter:grayscale(1) brightness(.75);opacity:.35}
.medals .no{color:#8f8778}
.path{font-family:var(--font-display);font-weight:500;font-size:16px;line-height:1.7;word-spacing:.12em}
.path b{color:var(--rust)}

/* Fenêtres */
.modal{position:fixed;inset:0;z-index:20;background:rgba(18,23,26,.72);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal{align-items:center;padding:24px}}
.modal .panel{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px 22px 30px;border-top:5px solid var(--rust);border-radius:10px 10px 0 0}
@media (min-width:700px){.modal .panel{border-radius:6px}}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.x{border:2px solid var(--ink);background:var(--paper);border-radius:4px;font-family:var(--font-display);font-weight:700;padding:8px 12px 5px;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.foot{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:16px;font-family:var(--font-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.foot button{background:none;border:0;color:#d5dcde;text-decoration:underline;text-underline-offset:3px;padding:6px}
.jump{display:flex;flex-direction:column;gap:8px}
.jump .opt{box-shadow:none;padding:10px 12px;font-size:16px}
.adj{display:flex;align-items:center;gap:12px;font-weight:600}
.adj button{width:42px;height:42px;border:2px solid var(--ink);background:#fff;border-radius:4px;font-family:var(--font-display);font-weight:700;font-size:22px;padding:4px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const DATA = {"1": {"paras": ["8h10, c’est l’heure pour toi de te réveiller. Tu fais toujours sonner ton réveil au dernier moment pour profiter au maximum ; tu sais que tu seras à l’heure malgré tout ; tu es tellement rapide à te préparer ! Tu éteins ton alarme d’un swipe sur ton téléphone, puis tu pars te préparer pour une nouvelle journée de CSM.", "Cela fait maintenant presque trois ans que tu as rejoint cette start-up qui propose un logiciel SaaS pour favoriser le travail collaboratif au sein des organisations. C’est ton deuxième rôle en tant que CSM, après 3 ans au sein d’une start-up où tu as tout appris. Depuis que tu as rejoint “BetterTogether”, tu as connu des hauts et des bas, des réussites, mais aussi quelques churns. “On ne peut pas tous les sauver”, répète souvent ta collègue Rita pour dédramatiser la situation lors des soirées que vous passez parfois entre collègues pour débriefer la journée. Mais tu aimerais bien faire un sans-faute. Être “THE” CSM : 0% de churn, 100% de clients satisfaits, 1000% d’upsells et une promotion que tu espères rapide.", "Tu finis de te préparer en réfléchissant à tout ça. Tu penses à tes clients, à tes collègues, à tes journées bien remplies, comme celle qui arrive : QBR, training, kick-off… tu ne vas pas t’ennuyer, mais c’est ce que tu aimes ! C’est pour cela que tu as choisi de devenir Customer Success Manager et que tu pars travailler chaque matin le sourire aux lèvres. Et aujourd’hui ? Tu le sais, toutes les journées ne se valent pas ; tout dépend bien souvent de la nuit que tu as passée !"], "next": {"type": "hasard", "intro": "Fais appel au hasard pour découvrir comment ta journée commence.", "rules": [[0, 3, 177, "Si tu obtiens entre 0 et 3"], [4, 6, 11, "Si tu obtiens entre 4 et 6"], [7, 9, 91, "Si tu obtiens entre 7 et 9"]]}}, "2": {"paras": ["Alors que tu allais partir, tu as une illumination : cette journée n’est vraiment pas faite pour toi. Tu le sais, tu le sens, quelque chose va mal se passer. Alors, pourquoi perdrais-tu du temps et de l’énergie à aller travailler aujourd’hui ?", "Soyons honnêtes, tu as tellement d’autres choses à faire : ce jeu vidéo à terminer, cet ami que tu n’as pas vu depuis plusieurs mois qui est de passage dans ta ville, ce site que tu as prévu de vibe-coder depuis des semaines… Et puis, tu as un petit peu la flemme aussi ; tu préférerais retourner te coucher.", "De toute façon, depuis quelques semaines, ton manager ne te regarde plus comme avant. Il n’y a plus cette lueur dans son regard, cette confiance qu’il avait en toi au début. Non, clairement, tu ne lui manqueras pas. D’ailleurs, tu ne lui envoies même pas de message. Tu éteins ton téléphone et tu retournes te coucher. Tes clients attendront, leurs QBR et leurs formations aussi. Aujourd’hui tu n’es là pour personne !"], "next": {"type": "end", "outro": "C’était un peu court ! Évidemment, si tu ne vas pas travailler, l’histoire s’arrête ici ! Recommence ta lecture en faisant des choix qui t’amèneront à vivre ces 24 heures de folie !"}, "fx": {"trophy": "tgv"}}, "6": {"paras": ["Comme tous les matins, tu ne peux pas t’empêcher de faire le tour du bureau pour dire bonjour à toutes les équipes. Tu te vois comme un lien indispensable entre tous, une sorte de “Master of Ceremonies” qui se doit d’apporter de la joie et de la bonne humeur à ses collègues. Ce n’est pas pour rien que tu es la personne la plus populaire de ton entreprise. Tu connais tout le monde, tu as un petit mot sympa, une question ou une petite anecdote pour chaque personne que tu croises. Bien sûr, cela prend du temps, mais tu penses que c’est vraiment important.", "Les CSM sont au cœur de la machine. Ils doivent collaborer avec les sales, le marketing, le support, les équipes transverses et bien d’autres encore. Si tu ne fais pas ce travail d’ambassadeur, personne ne le fera à ta place. Et le jour venu, lorsque tu auras besoin d’aide en urgence, tu sais que tu pourras compter sur tes collègues.", "Le temps passe ; les discussions s’enchaînent. Tu es en train de rigoler avec Martine de la compta lorsque tu regardes ta montre : il est 9h59 et ton QBR commence dans 1 minute. Oups !"], "next": {"type": "goto", "to": 216, "label": "Cours vite au chapitre suivant !"}}, "11": {"paras": ["Ni trop, ni pas assez. La nuit aurait pu être bien pire, mais elle aurait pu être meilleure. Ta soirée entre amis s’est terminée un peu tard, mais tu as quand même eu tes 7 heures de sommeil.", "Quelques cauchemars étranges : un bug et des clients mécontents, une formation qui dérape, un QBR au cours duquel tes clients te challengent plus que d’habitude… ce n’est pas la première fois que tu fais ce genre de rêves, mais tout avait l’air si réaliste cette fois-ci ! Espérons que la fin de ton rêve, ce moment où ton manager te convoque pour te hurler dessus et te virer fissa, ne soit pas prémonitoire...", "Tu pars de chez toi en confiance, mais avec quelques doutes malgré tout... et l’espoir que la journée passe vite !"], "next": {"type": "goto", "to": 36, "label": "Il est temps de partir pour le bureau"}, "img": "ill11", "caption": "La nuit aurait pu être bien pire, mais elle aurait pu être meilleure."}, "21": {"paras": ["Affaires déposées à ton poste, ordinateur allumé, agenda et dashboards ouverts, tout est prêt. Il te reste un peu plus de 45 minutes avant ton QBR ; tu es large et décides donc d’aller à la cuisine prendre un café avec tes collègues. Damien et Rita ont toujours plein d’histoires très drôles à raconter, ce qui te mettra forcément de bonne humeur pour commencer la journée.", "Alors que tu te fais couler ton café en attendant qu’ils arrivent, Paulin, le sales avec lequel tu collabores le plus en ce moment, vient te demander conseil à propos d’un client sur lequel il travaille. Pas avare de ton temps et de ton expertise, tu partages avec lui quelques infos autour de l’onboarding et du déploiement d’autres clients similaires, du même secteur. Paulin est ravi ; avec ça, il devrait signer le deal plus rapidement !", "Ce café t’a donné un petit boost : tu gagnes un point d’énergie.", "Alors que tu poses ta tasse dans l’évier pour retourner à ton poste et finaliser ta présentation, Rita et Damien arrivent enfin. Il ne te reste plus beaucoup de temps avant le QBR ; tu le sais bien. Mais ce café ensemble le matin, c’est une tradition. Que décides-tu ?"], "next": {"type": "choice", "intro": "Que décides-tu ?", "options": [[126, "Tu préfères être sage et tu vas préparer ton QBR"], [152, "Tu reprends un café avec eux"]]}, "fx": {"energy": 1}, "fxPara": 2}, "36": {"paras": ["C’est l’heure de partir pour le bureau. Tu es largement dans les temps. Mais ce matin, tu hésites encore un peu. Comment t’y rendre ? Transports en commun ? Tu viens justement de recharger ta carte et tu as une ligne directe. La voiture ? Tu pourras écouter un épisode de CSM’s & Co, ton podcast préféré, comme tu le fais souvent. En vélo ? Un peu d’exercice pour commencer la journée, ça fait toujours du bien. Ou tout simplement à pied, tu aimes déambuler dans les rues de ta ville lorsque le soleil brille comme aujourd’hui. Ou alors, tu te demandes si tu ne ferais pas mieux de te faire porter pâle aujourd’hui. Une journée Netflix, repos, promenade au parc et terrasse avec des amis, c’est tentant aussi !"], "next": {"type": "choice", "intro": "Comment vas-tu au bureau ce matin ?", "options": [[233, "Tu décides finalement de prendre le métro"], [57, "Tu choisis de prendre la voiture"], [123, "Tu préfères pédaler un peu"], [120, "Tu as envie de marcher au soleil"], [2, "L’envie te prend de rester chez toi"]]}}, "52": {"paras": ["Dès ton premier slide, tu poses le décor : 98% d’adoption du produit, 89% d’utilisateurs qui se connectent tous les jours et 100% de collaborateurs qui recommandent la solution. Le projet est sur les bons rails, et la projection de ROI que tu présentes est particulièrement positive. Tu aimerais avoir ce type de statistiques chez tous tes clients et pouvoir commencer tous tes QBR dans de telles conditions. Tu profites donc du moment. Après tout, tu as bossé pour obtenir ce type de résultats ! Tu ne doutes pas un instant que la CEO sera impressionnée par ces chiffres et tu en fais des tonnes :", "— Comme vous le constatez, les KPIs de succès sont largement au-dessus de nos objectifs et des benchmarks observés sur des projets similaires au vôtre. D’ailleurs, depuis que je suis CSM ici, je ne crois pas avoir vu d’aussi bons chiffres, c’est incroyable, vous êtes vraiment au top !", "Tout le monde semble ravi de voir ces résultats, surtout ton champion, qui a beaucoup donné pour évangéliser en interne, ainsi que le responsable du projet avec qui tu collabores depuis 9 mois pour implémenter la solution. C’est en pleine confiance que tu poses une question qui te semble rhétorique vu les performances, mais qui est importante pour prendre la température de la pièce :", "— Et vous, comment voyez-vous le projet ? Êtes-vous alignés avec ces résultats ? Quelle est la perception que vous en avez ?"], "next": {"type": "hasard", "intro": "", "rules": [[0, 4, 247, "Si tu obtiens entre 0 et 4"], [5, 9, 194, "Si tu obtiens 5 ou plus"]]}}, "55": {"paras": ["Avant même que ton call ne commence, tu te doutais que ce QBR risquait de ne pas être de tout repos. Malgré tout le temps et toute l’énergie que tu as investis dans ce compte, les résultats tardent encore à venir. Tu as pris par la main plusieurs utilisateurs et équipé les champions comme tu l’as appris dans vos playbooks, mais l’adoption stagne à un peu moins de 60% et ne semble pas progresser depuis plusieurs semaines. Il va falloir jouer serré pour quand même montrer quelques succès et faire en sorte que la discussion se passe bien. C’est justement ce que tu as prévu, mais tu entames ce call avec une sérénité mitigée.", "Avant de dérouler ta présentation et d’exprimer ton avis sur le compte, tu décides de prendre la température. Ton opinion est faite, mais tu dois t’adapter à ton public. Tu croises les doigts en posant la question :", "— Avant de démarrer, j’aimerais que l’on fasse un tour de table pour avoir votre avis rapide sur notre projet. Comment le percevez-vous à ce jour ?"], "next": {"type": "hasard", "intro": "Fais appel au hasard pour avoir la réponse à cette question cruciale.", "rules": [[0, 2, 108, "Si le résultat est de 0 à 2"], [3, 6, 165, "S’il est entre 3 et 6"], [7, 9, 217, "S’il est de 7 ou plus"]]}}, "57": {"paras": ["Tu as un peu la flemme ce matin. Pas envie de passer du temps dans les transports : il y a toujours des retards pour un oui ou pour un non. Tu n’as pas non plus l’énergie pour marcher ou faire du vélo. Tu choisis donc de prendre la voiture ; au moins, tu pourras écouter tranquillement le dernier épisode de ton podcast préféré !", "Tu sors de ton parking, roules quelques mètres, mais tu te retrouves très vite au milieu d’un énorme bouchon… a priori, tu n’es pas la seule personne à avoir eu cette idée ce matin ! Tu prends ton mal en patience, cet épisode est très intéressant, mais après avoir loupé 5 fois le feu, qui ne reste pas vert très longtemps, tu commences à t’impatienter !", "Tu te fais dépasser par de nombreux vélos, quelques piétons aussi, et tu te dis que tu aurais sûrement eu moins de stress si tu avais choisi un autre mode de transport, mais c’est trop tard. Tu rejoins tant bien que mal le bureau après avoir frôlé l’accident plusieurs fois, failli percuter 3 vélos et 6 scooters, et avec les oreilles qui résonnent encore des nombreux coups de klaxon désespérés des autres automobilistes, que tu as fini par imiter. Tu galères pour garer la voiture : aucune place disponible au parking du bureau, et tu finis par échouer un kilomètre plus loin. Tu cours pour ne pas arriver trop en retard ; tu débarques en sueur et en panique dans l’open-space. La journée commence mal !", "Tu perds un point d’énergie."], "next": {"type": "goto", "to": 206, "label": "Tu arrives au bureau"}, "fx": {"energy": -1}, "fxPara": 3}, "74": {"paras": ["Pas de temps à perdre ! Il est vrai qu’il est tentant de répondre oui à tes collègues qui te proposent de partager un petit café avant de commencer la journée. C’est d’ailleurs souvent ton rituel du matin : une pause dans la cuisine, autour d’un café, avec Damien et Rita pour débriefer les dernières news. Mais aujourd’hui ce sera sans toi ! Ils comprendront sans souci ; il te reste moins d’une heure pour revoir les slides que tu présenteras lors de ton QBR. Tu sais que le client est exigeant et que tout n’a pas toujours été rose sur ce projet ; tu ne veux donc rien laisser au hasard.", "— Tu viens prendre un café ? J’ai une histoire de dingue à vous raconter !", "C’est Damien. Célibataire depuis peu, il enchaîne les dates et a toujours des anecdotes très drôles à partager. C’est tentant. Mais tu restes solide dans tes convictions.", "— Ça aurait été avec plaisir, mais j’ai mon QBR avec Divelop à 10h et je préfère revoir mes slides pour m’assurer de ne rien avoir oublié. Tu les connais : c’est pas toujours évident avec eux, et le renouvellement est dans 3 mois ; je veux marquer des points.", "Damien regarde Rita, un peu surpris et déçu à la fois :", "— Ok, tant pis pour toi, tu vas louper du très lourd ! Tu viens ? Laissons notre élève modèle sauver la boîte !", "Tu les vois s’éloigner à contrecœur… Il suffirait que tu te lèves et que tu les rejoignes pour commencer cette journée en rigolant. Mais tu repenses à Mme Brunier, la CEO de Divelop, et à son obsession du détail. Tu restes à ton bureau et te plonges dans ta présentation. 45 minutes pour faire des étincelles à ton QBR : parfait !"], "next": {"type": "goto", "to": 204, "label": "Avance sereinement vers le début de ta réunion"}}, "91": {"paras": ["Quelle nuit ! Non mais quelle nuit ! Tu sens qu’aujourd’hui rien ne pourra te résister ! Tu as décidé d’aller te coucher tôt, et tu as bien fait ! Pour une fois, aucun voisin n’a organisé de soirée à rallonge, zéro travaux dans ta rue et aucun groupe d’amis ne s’est retrouvé devant ton immeuble pour discuter jusqu’à pas d’heure. Bref, tu as eu ta dose de repos et tu sens qu’aujourd’hui rien ne peut t’atteindre : tu es au summum de ton game !", "Mieux encore, tu as fait des rêves que tu espères prémonitoires : des clients qui te remercient pour ton accompagnement, une formation qui génère un upsell de 200 licences et ton manager qui te convoque dans son bureau pour te donner une promotion... et l’augmentation de salaire conséquente qui va avec !", "Même si la moitié de ces rêves se réalise, ce sera déjà plus qu’une bonne journée. Tu es au taquet ! Let’s go !", "Tu gagnes un point d’énergie."], "next": {"type": "goto", "to": 36, "label": "Il est temps de partir pour le bureau"}, "fx": {"energy": 1}, "fxPara": 3}, "120": {"paras": ["Tu regardes par la fenêtre. Il fait beau ce matin ; aller au bureau à pied te semble donc évident. Après tout, il n’y a qu’une petite demi-heure de marche qui te sépare de ton lieu de travail.", "Tu en profites à fond : le chant des oiseaux dans la rue, la ville qui se réveille, avec ses restaurants qui ouvrent et ses boulangeries d’où s’échappent de délicieuses odeurs de croissants chauds qui te font saliver. Tu flânes devant les vitrines et prends un petit café à emporter en passant par ton coffee shop préféré. Quelle chance d’exercer ce beau métier que tu aimes tant… penses-tu en sifflotant, les cheveux au vent, en planifiant tranquillement ta journée. Petite pensée pour tous ces gens bloqués dans leurs voitures ou entassés dans les bus, oui, vraiment, la vie est bien plus belle à pied !", "Tu arrives au bureau en pleine détente, de bonne humeur, et en plus, tu as fait un peu d’exercice pour bien commencer ta journée. Que pourrait-il t’arriver maintenant ? Tu es ready pour toutes les éventualités : cette journée, c’est la tienne !"], "next": {"type": "goto", "to": 206, "label": "Tu arrives au bureau"}}, "123": {"paras": ["Ce matin, tu as envie de sentir le vent dans tes cheveux, de profiter du beau temps et de faire un peu de sport ; tu décides donc de prendre ton vélo. Tu essaies de faire ça régulièrement. C’est important de rester en forme pour être au top avec tes clients ! Tu n’oublies pas ton casque (que feraient tes clients s’il t’arrivait quelque chose ?) et tu te lances sur la chaussée. Le bureau n’est pas si loin, à peine 8 kilomètres, tout en pistes cyclables hyper agréables.", "Tu parcours ta ville, l’esprit libre, la motivation à bloc pour cette nouvelle journée qui commence. Rien de tel pour arriver en forme que cette petite demi-heure de vélo. Tu passes par quelques monuments que tu connais bien ; ça te rappelle d’ailleurs que tes meilleurs amis viennent ce week-end et qu’il te faudra préparer quelques activités pour que ce moment soit parfait.", "Tu accélères, le cœur léger, tu dépasses d’autres usagers, moins rapides que toi, fais un léger écart pour éviter un piéton inattentif, sens les odeurs de la boulangerie en bas du bureau, et tu arrives enfin. Tu as un peu transpiré, tu espères que ça ne dérangera pas trop tes collègues, mais tu t’en fiches. Quel bonheur de venir à vélo !"], "next": {"type": "goto", "to": 206, "label": "Tu arrives au bureau"}}, "126": {"paras": ["Tes amis sont contents de te voir. Ils le sont beaucoup moins lorsque tu leur annonces que tu ne vas pas rester. Damien avait des anecdotes tellement croustillantes à partager ; il est déçu. Célibataire depuis peu, il enchaîne les dates et celui d’hier soir semblait valoir le détour. Tant pis, tu lui dis que ce sera pour une autre fois.", "— Mais c’est pas sérieux ! Franchement, tant pis pour toi ! Rita, elle est fidèle à la tradition et je vais tout lui raconter. Tu loupes vraiment quelque chose, c’était n’importe quoi hier soir ! — J’imagine, oui, mais tu connais mon client Divelop. J’ai un QBR avec eux dans 30 minutes et je veux revoir les slides avant. Le dernier rendez-vous était un peu tendu et le renouvellement est dans 3 mois.", "Heureusement, Rita vient à ta rescousse :", "— Moi je te comprends, file de là ! Après tout, on est un peu à la bourre aussi. Et t’inquiète pas, je te débrieferai des aventures du Dam’s !", "Tu la remercies vivement, salues tes amis et retournes à ton poste de travail. Les choses sérieuses peuvent commencer : tu te plonges dans tes slides et révises tes notes."], "next": {"type": "goto", "to": 204, "label": "Direction ton QBR"}}, "152": {"paras": ["— Bon, faut que je vous raconte ma soirée d’hier, vous allez voir, c’était n’importe quoi !", "Lorsque Damien commence comme ça, tu sais que ça va durer longtemps, mais surtout que ce sera une franche partie de rigolade. Célibataire depuis quelques mois, il enchaîne les dates et vous débriefe, Rita et toi, le matin à la machine à café. Et vous le lui rendez bien, ce qui entraîne de longues discussions peu professionnelles, mais toujours aussi plaisantes entre amis.", "Tu enchaînes avec un deuxième café en écoutant ses histoires. Damien est un vrai pro pour raconter. Il mêle suspense, émotions, rebondissements et humour. Tu te demandes souvent s’il est aussi bon en storytelling avec ses interlocuteurs. C’est peut-être d’ailleurs son secret pour créer une relation aussi fluide avec ses plus gros clients ?", "Tu es loin dans tes pensées lorsque tes yeux se posent sur la pendule accrochée au mur de la cuisine. Panique immédiate : il est 9h59 ; ton QBR commence dans une minute. Il n’y a plus de temps à perdre ! Tu poses ta tasse, salues tes collègues et tapes un sprint jusqu’à ton poste de travail."], "next": {"type": "goto", "to": 216, "label": "Cours vite au chapitre suivant !"}}, "171": {"paras": ["En sortant du bureau, tu dégaines ton téléphone pour voir précisément le trajet à suivre. Tu sais qu’il te faut une dizaine de minutes, mais tu n’as pas un super sens de l’orientation, donc tu préfères t’assurer de partir dans la bonne direction. C’est confirmé : 12 minutes de marche selon Google Maps, donc moins de 10 minutes pour toi ; tu marches vite. Par acquit de conscience, et pour éviter toute déconvenue, tu vérifies une nouvelle fois que tu as bien ton ordinateur dans ton sac. Ok, tu as tout ce qu’il faut, c’est parti !", "Si le début du parcours est assez simple, toujours tout droit dans la même direction, les cinq dernières minutes sont un peu plus complexes et tu dois suivre de près sur ton écran pour ne pas te perdre dans les petites ruelles. Un coup à droite, puis à gauche, dans un passage réservé aux piétons puis au travers d’un square ; tu restes focus sur ton écran pour ne pas te louper et rester dans les temps. Mais à trop regarder son écran, on manque parfois certaines infos importantes, surtout si l’on est fatigué..."], "next": {"type": "energy", "intro": "Quel est ton niveau d’énergie ?", "rules": [[-10, -1, 127, "S’il est inférieur à 0"], [0, 10, 23, "S’il est de 0 ou plus"]]}, "outside": true}, "177": {"paras": ["Aujourd’hui, tu commences la tête dans le c**. Tu n’as pourtant pas abusé hier soir, lors de la soirée avec tes potes. Un bon repas, quelques verres, rien d’excessif. Malheureusement, tes voisins avaient un programme bien plus corsé : ils ont fait la fête jusqu’à 5 heures du matin ! Bruits de pas incessants, “les démons de minuit” en boucle et à plein volume, des voix fortes sur le balcon pour couvrir la musique… tu as eu du mal à fermer l’œil et ça t’a rendu dingue ! Tu as bien essayé de faire baisser le volume : tu as sonné à la porte vers 1h, tapé ton plafond à coups de balai entre 2h et 3h, hurlé par la fenêtre vers 4h… sans succès. Et lorsque la soirée a enfin pris fin, ton sommeil a été très... agité : clients mécontents qui t’appellent pour churner, manager qui te donne des objectifs inatteignables, formation qui dérape, champion qui disparaît…", "Tu pars pour le travail un peu down, espérons que la journée ne sera pas trop compliquée.", "Tu perds un point d’énergie."], "next": {"type": "goto", "to": 36, "label": "Il est temps de partir pour le bureau"}, "fx": {"energy": -1}, "fxPara": 2}, "194": {"paras": ["Tu attends, un peu fébrile malgré la confiance que tu as projetée en démarrant cette réunion, que tes clients prennent la parole. C’est la CEO qui ouvre son micro en premier :", "— Merci pour cette analyse et pour tes compliments, c’est très agréable à entendre. Cependant, permets-moi de partager avec toi notre analyse, qui diffère légèrement de ton bilan. Nous nous sommes réunis hier pour faire le point avant cette discussion, et nous n’avons pas l’impression d’avoir beaucoup avancé depuis quelques mois. Les chiffres stagnent, les retours du terrain semblent mitigés. Le produit évolue peu. Je t’avoue que j’ai du mal à comprendre comment tu peux être si dithyrambique. Des réussites, oui, nous sommes d’accord, mais il me semble qu’il reste encore beaucoup de route à faire avant de crier « bravo », non ?", "Aïe, c’est la douche froide. Voici un client qui, malgré des résultats clairement excellents, ne perçoit pas suffisamment la valeur. C’est un scénario classique et tu en as l’habitude. Il est donc temps de répondre à cette objection du mieux que tu peux."], "next": {"type": "skill", "skill": "pedago", "intro": "Quel est ton niveau en pédagogie ?", "rules": [[0, 2, 107, "Si tu as 2 ou moins"], [3, 5, 51, "Si tu as 3 ou plus"]]}}, "204": {"paras": ["Alors que tes clients se connectent au call (que tu as lancé avec 5 minutes d’avance), tu te félicites d’avoir pris le temps nécessaire pour revoir tes slides. Tu as eu le temps de corriger quelques imprécisions et de vérifier quelques chiffres. Le narratif est clair, structuré, impactant et tu as même ajouté un “exec summary” au début pour rassembler les idées clés. Ton client va adorer.", "Alors que vous vous saluez, la CEO, sponsor du projet et détentrice du budget pour le renouvellement, annonce qu’elle ne pourra rester que la première demi-heure, car elle a été appelée sur un autre rendez-vous important qui a été ajouté il y a deux minutes. Tes derniers ajustements te semblent encore plus pertinents et tu souris intérieurement. Oui, décidément, tu as eu raison de te concentrer sur ta présentation ce matin. Tu vas tout déchirer ! Tout le monde est arrivé ; il est temps de démarrer ce QBR.", "Tu gagnes un point de succès."], "next": {"type": "goto", "to": 250, "label": "Va dérouler ta présentation"}, "fx": {"success": 1}, "fxPara": 2}, "206": {"paras": ["— Salut Loïc ! Hey Sophie, comment vas-tu ? Oula, tu es déjà arrivé, Benjamin ? Tu es tombé du lit ou quoi ?", "Comme tous les jours, tu retrouves ton équipe avec plaisir. Au fil des années, ils sont devenus plus que des collègues. Il faut dire que vous en avez vécu, des choses, ensemble : le premier client à plus de 500 000 euros, le passage du cap des 5 millions d’ARR, des meet-ups customer success, la journée à Engage en juin dernier, l’arrivée puis le départ quasi immédiat d’un manager qui ne comprenait rien… forcément, ça resserre les liens ! Pas autant que les verres que vous buvez souvent après votre journée de travail, les sorties du week-end et ce concert d’Aya Nakamura au Stade de France où vous avez vibré à l’unisson, mais ça compte quand même !", "Tu déposes tes affaires, allumes ton ordinateur en débriefant le dernier épisode de votre série préférée et tu vois passer ton manager, qui arrive tout juste. Il est un peu plus de 9h et il est temps de prendre une décision importante : s’y mettre tout de suite ou se laisser le temps d’arriver ? Tu enchaînes avec un QBR à 10 h, mais que fais-tu avant ?"], "next": {"type": "choice", "intro": "Tu enchaînes avec un QBR à 10 h, mais que fais-tu avant ?", "options": [[74, "Tu décides de réviser ton QBR"], [21, "Tu ne peux pas démarrer la journée sans un petit café"], [6, "Tu choisis de passer saluer tous tes collègues et de faire le tour du bureau"]]}}, "216": {"paras": ["Le temps de revenir à ton bureau, de prendre ton ordinateur et de trouver une salle libre où t’installer, il est 10h04 lorsque tu lances le call. Tu acceptes tes clients en balbutiant des excuses approximatives et tu vois que l’ambiance n’est pas au beau fixe. Alors que tu cherches à remettre la main sur tes slides, la CEO, sponsor du projet et détentrice du budget pour le renouvellement, t’annonce qu’elle ne pourra rester que la première demi-heure, car un meeting lui a été ajouté en dernière minute. Tu te maudis de ne pas avoir pensé à ajouter un “exec summary” ; elle partira du meeting sans avoir pu entendre certains messages clés. Si seulement tu avais passé la dernière heure à revoir tes slides ! Tu te rends d’ailleurs compte qu’il y a une erreur dès le premier et ton client la mentionne immédiatement : il n’a pas aimé l’utilisation de leur ancien logo...", "Tu te ressaisis, mais ce démarrage n’est pas idéal. Tu as plein de choses à leur partager malgré tout, tu sais que tu peux leur apporter de la valeur. Let’s go !"], "next": {"type": "goto", "to": 250, "label": "Va dérouler ta présentation"}}, "217": {"paras": ["Le silence qui suit ta question semble s’éterniser. Tu constates que les regards sont fuyants, comme si personne n’osait vraiment prendre la parole. C’est Esteban, le directeur du projet, ton point de contact principal, qui finalement rompt le silence :", "— Dans un premier temps, je souhaite te remercier, en mon nom et en celui de toute l’équipe, pour le travail que tu fournis et l’accompagnement sans faille que tu apportes depuis le début du projet. Nous nous sentons soutenus dans notre transformation, et c’est grâce à toi. Malheureusement, je vais être honnête avec toi, nous ne voyons pas d’impact aujourd’hui au sein des équipes. L’adoption reste très faible et les retours que j’ai du terrain ne sont pas toujours rassurants. Nous nous posons beaucoup de questions et avons l’impression qu’il reste encore un long chemin à parcourir avant de voir un ROI. Quelle est ton analyse des résultats ?", "Ça pique… Tu sais bien que les résultats ne sont pas aussi bons que tu l’aurais voulu, mais c’est loin d’être une telle catastrophe !", "Ce call se complique. Tu sais qu’il va falloir jouer serré et faire preuve de persuasion pour retourner une situation si mal embarquée. Sauras-tu résister à la pression qui commence à s’installer et continuer la réunion dans les meilleures conditions ?"], "next": {"type": "skill", "skill": "stress", "intro": "À quel point as-tu une bonne gestion du stress ?", "rules": [[0, 1, 158, "Si tu as entre 0 et 1"], [2, 5, 162, "Si tu as entre 2 et 5"]]}}, "225": {"paras": ["Ce QBR ne sera pas facile, tu le sais bien. L’adoption stagne à tout juste 30% au 9e mois et la plupart des utilisateurs “actifs” ne se connectent qu’une à deux fois par semaine au plus. Tu n’as aucune success story remontée du terrain, et même ton champion, que tu as eu beaucoup de mal à identifier, ne répond pas souvent, car il n’a rien d’intéressant pour toi. Tu t’épuises depuis des mois sur ce compte et, malgré tous tes efforts pour embellir la situation dans tes slides, tu as bien peur de ne pas parvenir à faire passer des messages positifs.", "Avant de démarrer, tu décides de demander à tes clients comment ils voient les choses, en croisant les doigts aussi fort que possible pour qu’ils ne soient pas trop conscients de la débâcle qui se joue en coulisses sur ce projet qui n’a clairement plus rien de stratégique. Même si tu stresses à l’idée des retours que tu vas avoir, tu poses LA question :", "— Avant de démarrer, j’aimerais que l’on fasse un tour de table rapide. J’aimerais avoir votre avis sur notre projet à ce jour. Comment le percevez-vous ?"], "next": {"type": "hasard", "intro": "", "rules": [[0, 6, 222, "Si tu obtiens entre 0 et 6"], [7, 9, 153, "Si tu obtiens 7 ou plus"]]}}, "233": {"paras": ["Comme la plupart du temps, tu décides de prendre le métro. Plus rapide que la voiture (pas de temps perdu dans les bouchons), moins fatigant que la marche, et moins dangereux que le vélo (les gens conduisent n’importe comment par ici !).", "Tu arrives sur le quai : le prochain train est là dans 2 minutes et il n’y a presque personne. Parfait, tu aimes ce genre de combo ! Un peu plus loin sur le quai, tu reconnais Patrick Duchale, ton champion chez Bluetech, l’un de tes principaux clients : incroyable ! Tu entames la discussion alors que le métro arrive et vous montez ensemble. Il est content de te voir et partage même avec toi quelques infos sur le rachat imminent d’un de leurs plus gros concurrents.", "Tu flaires l’upsell à venir ; il faudra que tu en parles à ton équipe pour ne pas louper le coche ! Quel plaisir de travailler avec Patrick... Sur ta lancée tu lui proposes même d’aller boire un verre un de ces quatre et il accepte. Tes clients sont vraiment heureux de travailler avec toi !", "Tu descends à ta station non sans avoir obtenu quelques infos supplémentaires en lui promettant de le tenir au courant des nouvelles licences qui doivent être déployées dans quelques semaines. Tu sors du métro le sourire aux lèvres. Décidément, cette journée s’annonce bien !"], "next": {"type": "goto", "to": 206, "label": "Tu arrives au bureau"}}, "250": {"paras": ["Après quelques échanges conventionnels sur la pluie et le beau temps, les vacances des uns et des autres et les résultats sportifs du week-end, le temps que tout le monde se connecte, tu passes aux choses sérieuses. La bonne nouvelle du jour, c’est que tout le monde est bien présent : contrairement à ton dernier QBR, où seul le champion avait pu se rendre disponible, la CEO, le responsable du projet et 5 ou 6 autres personnes, impliquées à différents niveaux, ont pu se joindre à la réunion. Cela te booste : le projet est enfin une priorité au sein de l’organisation ; c’est un beau win pour toi. Ou alors… il y a un souci ! Si autant de monde se connecte, après 9 mois de projet et alors que le renouvellement approche, c’est peut-être une mauvaise nouvelle ?", "Malgré le doute qui pointe son nez, tu te lances pour présenter l’état actuel du projet et, avec quelques questions ouvertes, comprendre la perception qu’en ont tes interlocuteurs."], "next": {"type": "hasard", "intro": "", "rules": [[0, 2, 52, "Si tu obtiens entre 0 et 2"], [3, 6, 55, "Si tu obtiens entre 3 et 6"], [7, 9, 225, "Si tu obtiens entre 7 et 9"]]}}};

const esc = (t) => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/ ([?!;:»])/g,"\u00a0$1").replace(/« /g,"«\u00a0");
const signed = (n) => (n > 0 ? "+" + n : String(n)).replace("-","−");
const reduced = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Règles ---------- */
function matchRule(nx){
  if(nx.type === "skill") return nx.rules.find(r => S.skills[nx.skill] >= r[0] && S.skills[nx.skill] <= r[1]);
  if(nx.type === "energy") return nx.rules.find(r => S.energy >= r[0] && S.energy <= r[1]);
  if(nx.type === "hasard" && S.res) return nx.rules.find(r => S.res.v >= r[0] && S.res.v <= r[1]);
  return null;
}
function enter(n){
  const c = DATA[n];
  S.screen = "chapter"; S.cur = n; S.res = null; S.lockedTo = null; S.path.push(n);
  bump = null;
  if(c.fx){
    if(c.fx.energy){ S.energy = Math.max(-10, Math.min(10, S.energy + c.fx.energy)); bump = "energy"; }
    if(c.fx.success){ S.success += c.fx.success; bump = "success"; }
    if(c.fx.trophy && !S.trophies.includes(c.fx.trophy)){ S.trophies.push(c.fx.trophy); bump = "trophy"; }
  }
  save(); render(); window.scrollTo(0,0);
}
function go(to){
  if(DATA[to]){ enter(to); return; }
  S.screen = "demoEnd"; S.lockedTo = to; bump = null; save(); render(); window.scrollTo(0,0);
}
// Rejouer ramène à la couverture ; seul « Refaire ma fiche » va droit à la fiche de personnage.
function newGame(screen){
  const keep = S.trophies, draft = S.skills ? Object.assign({}, S.skills) : S.draft;
  S = fresh(); S.trophies = keep; S.draft = draft; S.screen = screen || "home";
  save(); render(); window.scrollTo(0,0);
}
// Chaque chiffre de 0 à 9 a exactement une chance sur dix : on tire d'abord le chiffre,
// puis une des cases de la grille qui le porte.
function pickCell(){
  const v = String(Math.floor(Math.random()*10)), cells = [];
  GRID.forEach((row, r) => [...row].forEach((d, c) => { if(d === v) cells.push({r, c}); }));
  return cells[Math.floor(Math.random()*cells.length)];
}
function draw(){
  const btn = $("#draw"); if(!btn || S.res) return;
  btn.setAttribute("aria-disabled","true"); btn.disabled = true;
  const {r, c} = pickCell();
  const cells = document.querySelectorAll("#grid span");
  const land = () => { S.res = {r, c, v: Number(GRID[r][c])}; save(); renderCue(); const el = $("#result"); if(el) el.scrollIntoView({block:"center",behavior:reduced()?"auto":"smooth"}); };
  if(reduced()){ land(); return; }
  let k = 0;
  const hop = () => {
    cells.forEach(x => x.classList.remove("scan"));
    if(k++ >= 13){ land(); return; }
    cells[Math.floor(Math.random()*cells.length)].classList.add("scan");
    setTimeout(hop, 60 + k*9);
  };
  hop();
}

/* ---------- Morceaux d'interface ---------- */
function tally(n){
  if(n <= 0) return "";
  let x = 4, out = "";
  for(let i = 1; i <= n; i++){
    if(i % 5 === 0){ out += `<line x1="${x-34}" y1="27" x2="${x-2}" y2="7"/>`; x += 14; }
    else { out += `<line x1="${x}" y1="4" x2="${x}" y2="30"/>`; x += 8; }
  }
  return `<svg viewBox="0 0 ${x+2} 34" role="img" aria-label="${n} point${n>1?"s":""} de succès" stroke="#1d1b18" stroke-width="2.6" stroke-linecap="round">${out}</svg>`;
}
function boxes(n){ return `<span class="boxes" aria-hidden="true">${[1,2,3,4,5].map(i => `<i class="${i<=n?"f":""}"></i>`).join("")}</span>`; }
function gauge(e){
  let t = "";
  for(let i = -10; i <= 10; i++){
    const left = (i+10)*5;
    t += `<span class="tick ${i%10===0?"":"minor"}" style="left:${left}%"></span>`;
    if(i%5===0) t += `<span class="lab" style="left:${left}%">${signed(i)}</span>`;
  }
  return `<div class="gauge" role="img" aria-label="Énergie : ${signed(e)}"><span class="line"></span>${t}<span class="dot" style="left:${(e+10)*5}%"></span></div>`;
}
function fxChips(fx){
  let h = "";
  if(fx.energy) h += ` <span class="chip ${fx.energy>0?"gain":"loss"}">${signed(fx.energy)} énergie</span>`;
  if(fx.success) h += ` <span class="chip gain">${signed(fx.success)} succès</span>`;
  return h;
}
function hud(){
  const b = (k) => bump === k ? ' class="bump"' : "";
  return `<button class="hud" data-act="sheet" aria-label="Ouvrir ma fiche de personnage">
    <span class="hud-chap"><span class="lbl">Chap.</span><b>${S.cur ?? "–"}</b></span>
    <span class="hud-energy"><span class="lbl">Énergie</span><span class="row"><span class="track"><i style="left:${(S.energy+10)*5}%"></i></span><b${b("energy")}>${signed(S.energy)}</b></span></span>
    <span><span class="lbl">Succès</span><b${b("success")}>${S.success}</b></span>
    <span class="hud-tro"><img src="${IMG.t_tgv}" alt=""><span><span class="lbl">Trophées</span><b${b("trophy")}>${S.trophies.length}/16</b></span></span>
    <span class="hud-more">Fiche</span>
  </button>`;
}
const note = (t) => `<p class="note"><b>Note de test</b>${t}</p>`;
const foot = () => `<div class="foot"><button data-act="rules">Règles du jeu</button><button data-act="tools">Outils de test</button><button data-act="restart">Recommencer</button></div>`;
const toChip = (to) => `<span class="chip">Chapitre ${to}</span>`;
function rulesList(nx, hit){
  return `<ul class="rules">${nx.rules.map(r => `<li class="${hit ? (r===hit?"on":"off") : ""}"><span>${esc(r[3])}</span><span class="to">→ chapitre ${r[2]}</span></li>`).join("")}</ul>`;
}
function cue(c){
  const nx = c.next;
  if(nx.type === "goto") return `<h2 class="cue-t">La suite</h2><button class="btn wide" data-act="go" data-to="${nx.to}">${esc(nx.label)} ${toChip(nx.to)}</button>`;
  if(nx.type === "choice") return `<h2 class="cue-t">À toi de choisir</h2><p class="cue-q">${esc(nx.intro)}</p><div class="opts">${nx.options.map(o => `<button class="opt" data-act="go" data-to="${o[0]}"><span>${esc(o[1])}</span>${toChip(o[0])}</button>`).join("")}</div>`;
  if(nx.type === "hasard"){
    const hit = matchRule(nx);
    const g = `<div class="grid ${S.res?"done":""}" id="grid" aria-hidden="true">${GRID.map((row,r) => [...row].map((d,k) => `<span class="${S.res && S.res.r===r && S.res.c===k ? "hit":""}">${d}</span>`).join("")).join("")}</div>`;
    let h = `<h2 class="cue-t">Le hasard décide</h2>${nx.intro ? `<p class="cue-q">${esc(nx.intro)}</p>` : ""}${g}`;
    if(!S.res) h += `<button class="btn wide" id="draw" data-act="draw">Fais appel au hasard</button>${rulesList(nx,null)}`;
    else h += `<p class="result" id="result" aria-live="polite">Tu obtiens <b>${S.res.v}</b></p>${rulesList(nx,hit)}<button class="btn wide" data-act="go" data-to="${hit[2]}">Continuer ${toChip(hit[2])}</button>`;
    return h;
  }
  if(nx.type === "skill"){
    const hit = matchRule(nx), name = SKILLS.find(s => s[0]===nx.skill)[1], lvl = S.skills[nx.skill];
    return `<h2 class="cue-t">Tes compétences décident</h2><p class="cue-q">${esc(nx.intro)}</p><p class="mine">${esc(name)} ${boxes(lvl)} <span class="chip">${lvl} sur 5</span></p>${rulesList(nx,hit)}<button class="btn wide" data-act="go" data-to="${hit[2]}">Continuer ${toChip(hit[2])}</button>`;
  }
  if(nx.type === "energy"){
    const hit = matchRule(nx);
    return `<h2 class="cue-t">Ta fatigue décide</h2><p class="cue-q">${esc(nx.intro)}</p><p class="mine">Ta jauge d’énergie <span class="chip">${signed(S.energy)}</span></p>${gauge(S.energy)}${rulesList(nx,hit)}<button class="btn wide" data-act="go" data-to="${hit[2]}">Continuer ${toChip(hit[2])}</button>`;
  }
  // fin de partie
  const t = c.fx && c.fx.trophy ? TROPHIES.find(x => x[0]===c.fx.trophy) : null;
  return `<div style="text-align:center"><span class="stamp">Fin de partie</span></div>
    ${t ? `<div class="award"><img src="${IMG["t_"+t[0]]}" alt=""><div><span class="eyebrow" style="color:#c9d2d4">Tu gagnes le trophée</span><strong>${esc(t[1])}</strong></div></div>` : ""}
    <p>${esc(nx.outro)}</p>
    <div class="stack"><button class="btn wide" data-act="restart">Rejouer</button><button class="btn wide quiet" data-act="sheet">Voir ma fiche et mes trophées</button></div>`;
}
function renderCue(){ const el = $("#cue"); if(el) el.innerHTML = cue(DATA[S.cur]); }

/* ---------- Écrans ---------- */
function viewHome(){
  const inGame = S.cur && S.skills && (S.screen === "home");
  return `<div class="home">
    <h1 class="vh">Customer Success Marathon</h1>
    <img class="cover" src="${IMG.cover}" alt="Couverture du livre Customer Success Marathon, un livre dont tu es le héros">
    <div class="intro">
      <span class="tag">Version test</span>
      <p>Tes choix, le hasard, tes compétences et ta fatigue décident de ta journée de CSM. Ici : le réveil, le trajet et le début du QBR, soit 24 chapitres avec les vrais numéros du livre.</p>
      <div class="stack">
        ${inGame ? `<button class="btn wide" data-act="resume">Reprendre au chapitre ${S.cur}</button><button class="btn wide quiet" data-act="restart">Nouvelle partie</button>` : `<button class="btn wide" data-act="setup">Créer mon personnage</button>`}
      </div>
      <div class="by">François Decaux · Benjamin Marchand-Lenoir</div>
    </div>
  </div>`;
}
function viewSetup(){
  const used = SKILLS.reduce((a,s) => a + S.draft[s[0]], 0), left = 10 - used;
  return `<div class="sheet">
    <span class="eyebrow">Avant de commencer</span>
    <h1 class="title">Fiche de personnage</h1>
    <p class="sub">Répartis 10 points entre ces 4 compétences. 0 : tu ne la maîtrises pas du tout. 5 : tu la maîtrises parfaitement. Elles ne peuvent plus être modifiées une fois l’histoire commencée.</p>
    ${SKILLS.map(([k,name]) => `<div class="skill"><span class="name">${name}</span><span class="pick" role="group" aria-label="${name}">${[1,2,3,4,5].map(v => `<button class="${v<=S.draft[k]?"f":""}" data-act="sk" data-k="${k}" data-v="${v}" aria-label="${name} : ${v} sur 5" aria-pressed="${v<=S.draft[k]}"></button>`).join("")}</span></div>`).join("")}
    <p class="left" aria-live="polite">${left > 0 ? `Il te reste <b>${left}</b> point${left>1?"s":""} à répartir` : `Tes 10 points sont répartis`}</p>
    <button class="btn wide" data-act="start" aria-disabled="${left!==0}">Commencer la journée ${toChip(1)}</button>
    <div class="stack"><button class="btn wide quiet" data-act="rules">Lire les règles du jeu</button></div>
  </div>`;
}
function viewChapter(){
  const c = DATA[S.cur];
  let h = hud() + `<article class="sheet chap">`;
  if(c.outside) h += note("Ce chapitre vient de l’après-midi et ne fait pas partie de l’extrait gratuit. Il est là pour montrer un test de fatigue, absent de toute la partie avant le chapitre 145.");
  h += `<header class="chap-head"><span class="eyebrow">Chapitre</span><h1 class="num">${S.cur}</h1></header>`;
  if(c.img) h += `<figure class="ill"><img src="${IMG[c.img]}" alt="Illustration du chapitre ${S.cur}"><figcaption>${esc(c.caption)}</figcaption></figure>`;
  c.paras.forEach((p,i) => { h += c.fxPara === i ? `<p class="fx">${esc(p)}${fxChips(c.fx)}</p>` : `<p>${esc(p)}</p>`; });
  h += `<section class="cue" id="cue">${cue(c)}</section></article>` + foot();
  return h;
}
function sheetBody(){
  return `<h3 class="sec">Compétences</h3>
    ${S.skills ? SKILLS.map(([k,name]) => `<div class="skill"><span class="name">${name}</span><span>${boxes(S.skills[k])}</span></div>`).join("") : `<p class="sub">Pas encore répartie.</p>`}
    <h3 class="sec">Jauge d’énergie</h3>${gauge(S.energy)}
    <h3 class="sec">Points de succès</h3><div class="tally">${tally(S.success)}<span class="chip">${S.success}</span></div>
    <h3 class="sec">Trophées · ${S.trophies.length} sur 16</h3>
    <div class="medals">${TROPHIES.map(([k,name]) => `<div class="${S.trophies.includes(k)?"":"no"}"><img src="${IMG["t_"+k]}" alt="">${esc(name)}</div>`).join("")}</div>
    <h3 class="sec">Ton parcours</h3><p class="path">${S.path.length ? S.path.map((n,i) => i===S.path.length-1 ? `<b>${n}</b>` : n).join(" → ") : "–"}</p>`;
}
function viewDemoEnd(){
  return hud() + `<article class="sheet">
    <span class="eyebrow">La version test s’arrête ici</span>
    <h1 class="title">La suite est au chapitre ${S.lockedTo}</h1>
    <p>Dans le livre, ton aventure continue. Reporte ta fiche telle qu’elle est ci-dessous et reprends au chapitre ${S.lockedTo}.</p>
    ${note("Dans la version publique, cet écran arriverait au chapitre 145, à la fin du QBR. Le bouton d’achat ci-dessous est un emplacement : le lien reste à brancher.")}
    <div class="buy"><img src="${IMG.cover}" alt="Couverture du livre"><div><p>24 heures, 269 chapitres, 22 fins et 16 trophées t’attendent.</p><button class="btn wide" aria-disabled="true" disabled>Commander le livre</button></div></div>
    ${sheetBody()}
    <div class="stack"><button class="btn wide" data-act="restart">Rejouer</button><button class="btn wide quiet" data-act="tools">Tester une mécanique précise</button></div>
  </article>` + foot();
}
function render(){
  const v = S.screen;
  $("#app").innerHTML = v === "home" ? viewHome() : v === "setup" ? viewSetup() : v === "demoEnd" ? viewDemoEnd() : viewChapter();
}

/* ---------- Fenêtres ---------- */
function openModal(title, body){
  $("#modal-root").innerHTML = `<div class="modal" data-act="close"><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2 class="title" style="font-size:28px;margin:0">${esc(title)}</h2><button class="x" data-act="close" id="modal-x">Fermer</button></header>${body}</div></div>`;
  $("#modal-x").focus();
}
function closeModal(){ $("#modal-root").innerHTML = ""; }
function openSheet(){ openModal("Fiche de personnage", sheetBody()); }
function openRules(){
  openModal("Règles du jeu", `
    <p class="sub">Tu es CSM et tu vas vivre une journée vraiment spéciale. Les chapitres ne se lisent pas dans l’ordre : chacun se termine par une indication de jeu qui t’envoie vers le suivant.</p>
    <h3 class="sec">Le hasard</h3><p>Parfois, c’est le hasard qui détermine la suite. Dans le livre, tu fermes les yeux et tu pointes ton crayon sur la grille du hasard. Ici, tu appuies sur un bouton et un chiffre de 0 à 9 est tiré pour toi, chacun avec la même chance.</p>
    <h3 class="sec">Les choix</h3><p>À d’autres moments, c’est à toi de choisir, en ton âme et conscience.</p>
    <h3 class="sec">Les compétences</h3><p>Selon les circonstances, la suite dépend de ton niveau dans une compétence.</p>
    <h3 class="sec">La fatigue</h3><p>Tu commences à 0 sur la jauge d’énergie. Tu en gagnes ou tu en perds au fil de la journée, et ton niveau peut décider du chapitre suivant.</p>
    <h3 class="sec">Trophées et points de succès</h3><p>16 trophées sont cachés dans le livre. Il est impossible de tous les récupérer en une partie. Les points de succès que tu gagnes pourraient s’avérer utiles en fin de partie.</p>`);
}
function openTools(){
  openModal("Outils de test", `
    ${note("Ce panneau sert à juger chaque mécanique sans rejouer toute la partie. Il n’existerait pas dans la version publique.")}
    <h3 class="sec">Aller droit à une mécanique</h3>
    <div class="jump">${JUMPS.map(j => `<button class="opt" data-act="jump" data-to="${j[0]}"><span><strong>${esc(j[1])}</strong><br><span style="color:var(--ink-soft);font-size:14px">${esc(j[2])}</span></span></button>`).join("")}</div>
    <h3 class="sec">Régler l’énergie</h3>
    <div class="adj"><button data-act="e-" aria-label="Baisser l’énergie">−</button><span class="chip" id="adj-e">${signed(S.energy)}</span><button data-act="e+" aria-label="Monter l’énergie">+</button><span style="font-weight:400;font-size:15px">pour voir un test de fatigue basculer</span></div>
    <h3 class="sec">Compétences</h3>
    <button class="btn wide quiet" data-act="resheet">Refaire ma fiche de personnage</button>`);
}

/* ---------- Événements ---------- */
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(act === "close"){ if(el.classList.contains("modal") && ev.target !== el) return; closeModal(); return; }
  if(el.getAttribute("aria-disabled") === "true") return;
  if(act === "setup"){ S.screen = "setup"; save(); render(); window.scrollTo(0,0); }
  else if(act === "resume"){ S.screen = S.lockedTo ? "demoEnd" : "chapter"; render(); }
  else if(act === "sk"){
    const k = el.dataset.k; let v = Number(el.dataset.v);
    if(S.draft[k] === v) v -= 1;
    const others = SKILLS.reduce((a,s) => a + (s[0]===k ? 0 : S.draft[s[0]]), 0);
    S.draft[k] = Math.min(v, 10 - others);
    save(); render();
    const again = document.querySelector(`[data-act="sk"][data-k="${k}"][data-v="${el.dataset.v}"]`); if(again) again.focus();
  }
  else if(act === "start"){ S.skills = Object.assign({}, S.draft); S.energy = 0; S.success = 0; S.path = []; enter(1); }
  else if(act === "go"){ go(Number(el.dataset.to)); }
  else if(act === "draw"){ draw(); }
  else if(act === "sheet"){ openSheet(); }
  else if(act === "rules"){ openRules(); }
  else if(act === "tools"){ openTools(); }
  else if(act === "restart"){ closeModal(); newGame("home"); }
  else if(act === "resheet"){ closeModal(); newGame("setup"); }
  else if(act === "jump"){ closeModal(); if(!S.skills) S.skills = Object.assign({}, TEST_SKILLS); enter(Number(el.dataset.to)); }
  else if(act === "e-" || act === "e+"){
    S.energy = Math.max(-10, Math.min(10, S.energy + (act === "e+" ? 1 : -1))); save();
    $("#adj-e").textContent = signed(S.energy); bump = null; render();
  }
});
document.addEventListener("keydown", (ev) => { if(ev.key === "Escape") closeModal(); });

/* ---------- Démarrage ---------- */
function start(snapshot){
  const saved = snapshot && snapshot.screen ? snapshot : load();
  if(saved && saved.screen){
    S = Object.assign(fresh(), saved);
    if(S.cur && !DATA[S.cur]) S = Object.assign(fresh(), {trophies: S.trophies || []});
    if(!(snapshot && snapshot.screen) && S.screen !== "setup") S.screen = "home";
  }
  render();
}
window.claude?.hot?.snapshot?.(() => S);
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
